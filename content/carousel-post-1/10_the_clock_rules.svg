<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
<rect width="1080" height="1350" fill="#0F1712"/>
<rect x="871" y="46" width="119" height="46" rx="23" fill="none" stroke="#E24A12" stroke-width="2.5"/><text x="930.5" y="77.0" font-family="Liberation Sans" font-weight="bold" font-size="22" fill="#E24A12" stroke="#E24A12" stroke-width="1.0" stroke-linejoin="round" text-anchor="middle">RULES</text>
<ellipse cx="124" cy="150" rx="34.0" ry="17.0" fill="none" stroke="#E24A12" stroke-width="4.0"/><ellipse cx="124" cy="147.0" rx="19.0" ry="9.0" fill="none" stroke="#E24A12" stroke-width="2.6" opacity="0.55"/>
<text x="170" y="162" font-family="Liberation Sans" font-weight="bold" font-size="24" fill="#F1F3EE" stroke="#F1F3EE" stroke-width="1.0" stroke-linejoin="round" text-anchor="start">Learn Ultimate Frisbee</text>
<text x="990" y="162" font-family="Liberation Sans" font-weight="normal" font-size="24" fill="#F1F3EE" opacity="0.5" text-anchor="end">10 / 17</text>
<line x1="90" y1="208" x2="990" y2="208" stroke="#F1F3EE" stroke-width="2" opacity="0.15"/>
<text x="90" y="280" font-family="Liberation Sans" font-weight="bold" font-size="22" fill="#E24A12" stroke="#E24A12" stroke-width="1.0" stroke-linejoin="round" text-anchor="start">RULE 9.1  ·  STALL COUNT</text>
<text x="90" y="354" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">The marker administers a stall count on the</text>
<text x="90" y="404" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">thrower by announcing “Stalling” and then</text>
<text x="90" y="454" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">counting from one (1) to ten (10), at least</text>
<text x="90" y="504" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">one second apart.</text>
<text x="90" y="610" font-family="Liberation Sans" font-weight="bold" font-size="22" fill="#E24A12" stroke="#E24A12" stroke-width="1.0" stroke-linejoin="round" text-anchor="start">RULE 13.2.2  ·  TURNOVERS</text>
<text x="90" y="684" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">A “stall-out” occurs when the thrower has</text>
<text x="90" y="734" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">not released the pass before the marker</text>
<text x="90" y="784" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">first starts to say the word “ten” in the</text>
<text x="90" y="834" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">stall count.</text>
</svg>
<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
<rect width="1080" height="1350" fill="#0F1712"/>
<rect x="871" y="46" width="119" height="46" rx="23" fill="none" stroke="#E24A12" stroke-width="2.5"/><text x="930.5" y="77.0" font-family="Liberation Sans" font-weight="bold" font-size="22" fill="#E24A12" stroke="#E24A12" stroke-width="1.0" stroke-linejoin="round" text-anchor="middle">RULES</text>
<ellipse cx="124" cy="150" rx="34.0" ry="17.0" fill="none" stroke="#E24A12" stroke-width="4.0"/><ellipse cx="124" cy="147.0" rx="19.0" ry="9.0" fill="none" stroke="#E24A12" stroke-width="2.6" opacity="0.55"/>
<text x="170" y="162" font-family="Liberation Sans" font-weight="bold" font-size="24" fill="#F1F3EE" stroke="#F1F3EE" stroke-width="1.0" stroke-linejoin="round" text-anchor="start">Learn Ultimate Frisbee</text>
<text x="990" y="162" font-family="Liberation Sans" font-weight="normal" font-size="24" fill="#F1F3EE" opacity="0.5" text-anchor="end">6 / 17</text>
<line x1="90" y1="208" x2="990" y2="208" stroke="#F1F3EE" stroke-width="2" opacity="0.15"/>
<text x="90" y="280" font-family="Liberation Sans" font-weight="bold" font-size="22" fill="#E24A12" stroke="#E24A12" stroke-width="1.0" stroke-linejoin="round" text-anchor="start">RULE 4.1  ·  POINT, GOAL AND GAME</text>
<text x="90" y="354" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">A game consists of a number of points. Each</text>
<text x="90" y="404" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">point ends with the scoring of a goal.</text>
<text x="90" y="510" font-family="Liberation Sans" font-weight="bold" font-size="22" fill="#E24A12" stroke="#E24A12" stroke-width="1.0" stroke-linejoin="round" text-anchor="start">RULE 4.2  ·  POINT, GOAL AND GAME</text>
<text x="90" y="584" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">A game is finished and won by the first</text>
<text x="90" y="634" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">team to score fifteen (15) goals.</text>
<text x="90" y="740" font-family="Liberation Sans" font-weight="bold" font-size="22" fill="#E24A12" stroke="#E24A12" stroke-width="1.0" stroke-linejoin="round" text-anchor="start">RULE 14.1  ·  SCORING</text>
<text x="90" y="814" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">A goal is scored if an in-bounds player</text>
<text x="90" y="864" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">catches a legal pass and all their ground</text>
<text x="90" y="914" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">contact is entirely within the attacking</text>
<text x="90" y="964" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">end zone, and they establish and maintain</text>
<text x="90" y="1014" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">possession.</text>
</svg>
<svg viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
<rect width="1080" height="1350" fill="#0F1712"/>
<rect x="871" y="46" width="119" height="46" rx="23" fill="none" stroke="#E24A12" stroke-width="2.5"/><text x="930.5" y="77.0" font-family="Liberation Sans" font-weight="bold" font-size="22" fill="#E24A12" stroke="#E24A12" stroke-width="1.0" stroke-linejoin="round" text-anchor="middle">RULES</text>
<ellipse cx="124" cy="150" rx="34.0" ry="17.0" fill="none" stroke="#E24A12" stroke-width="4.0"/><ellipse cx="124" cy="147.0" rx="19.0" ry="9.0" fill="none" stroke="#E24A12" stroke-width="2.6" opacity="0.55"/>
<text x="170" y="162" font-family="Liberation Sans" font-weight="bold" font-size="24" fill="#F1F3EE" stroke="#F1F3EE" stroke-width="1.0" stroke-linejoin="round" text-anchor="start">Learn Ultimate Frisbee</text>
<text x="990" y="162" font-family="Liberation Sans" font-weight="normal" font-size="24" fill="#F1F3EE" opacity="0.5" text-anchor="end">16 / 17</text>
<line x1="90" y1="208" x2="990" y2="208" stroke="#F1F3EE" stroke-width="2" opacity="0.15"/>
<text x="90" y="280" font-family="Liberation Sans" font-weight="bold" font-size="22" fill="#E24A12" stroke="#E24A12" stroke-width="1.0" stroke-linejoin="round" text-anchor="start">RULE 1.1  ·  SPIRIT OF THE GAME</text>
<text x="90" y="354" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">Ultimate is a non-contact, self-officiated</text>
<text x="90" y="404" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">sport. All players are responsible for</text>
<text x="90" y="454" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">administering and adhering to the rules.</text>
<text x="90" y="560" font-family="Liberation Sans" font-weight="bold" font-size="22" fill="#E24A12" stroke="#E24A12" stroke-width="1.0" stroke-linejoin="round" text-anchor="start">RULE 15.10  ·  CALLING FOULS, INFRACTIONS AND VIOLATIONS</text>
<text x="90" y="634" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">If the player against whom the call was</text>
<text x="90" y="684" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">made disagrees, or thinks it is incorrect,</text>
<text x="90" y="734" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">they may call “Contest”.</text>
<text x="90" y="840" font-family="Liberation Sans" font-weight="bold" font-size="22" fill="#E24A12" stroke="#E24A12" stroke-width="1.0" stroke-linejoin="round" text-anchor="start">RULE 13.3  ·  TURNOVERS</text>
<text x="90" y="914" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">If a player determines a turnover occurred,</text>
<text x="90" y="964" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">they must call it immediately. If</text>
<text x="90" y="1014" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">contested, and players can’t agree, the</text>
<text x="90" y="1064" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">disc returns to the last non-disputed</text>
<text x="90" y="1114" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">thrower.</text>
</svg>
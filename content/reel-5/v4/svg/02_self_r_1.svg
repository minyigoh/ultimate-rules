<text x="90" y="280" font-family="Liberation Sans" font-weight="bold" font-size="22" fill="#E24A12" stroke="#E24A12" stroke-width="1.0" stroke-linejoin="round" text-anchor="start">RULE 1.1 · SPIRIT OF THE GAME</text>
<text x="90" y="354" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">Ultimate is a non-contact, self-officiated</text>
<text x="90" y="404" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">sport. All players are responsible for</text>
<text x="90" y="454" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">administering and adhering to the rules.</text>
<text x="90" y="504" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">Ultimate relies upon a Spirit of the Game</text>
<text x="90" y="554" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">that places the responsibility for fair</text>
<text x="90" y="604" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">play on every player.</text></g></svg>
<svg viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"><rect width="1080" height="1920" fill="#0F1712"/><g transform="translate(0,285.0)"><rect width="1080" height="1350" fill="#0F1712"/><rect x="871" y="46" width="119" height="46" rx="23" fill="none" stroke="#E24A12" stroke-width="2.5"/><text x="930.5" y="77.0" font-family="Liberation Sans" font-weight="bold" font-size="22" fill="#E24A12" stroke="#E24A12" stroke-width="1.0" stroke-linejoin="round" text-anchor="middle">RULES</text>
<ellipse cx="124" cy="150" rx="34.0" ry="17.0" fill="none" stroke="#E24A12" stroke-width="4.0"/><ellipse cx="124" cy="147.0" rx="19.0" ry="9.0" fill="none" stroke="#E24A12" stroke-width="2.6" opacity="0.55"/>
<text x="170" y="162" font-family="Liberation Sans" font-weight="bold" font-size="24" fill="#F1F3EE" stroke="#F1F3EE" stroke-width="1.0" stroke-linejoin="round" text-anchor="start">Learn Ultimate Frisbee</text>
<text x="990" y="162" font-family="Liberation Sans" font-weight="normal" font-size="24" fill="#F1F3EE" opacity="0.5" text-anchor="end">3 / 9</text>
<line x1="90" y1="208" x2="990" y2="208" stroke="#F1F3EE" stroke-width="2" opacity="0.15"/>
<text x="90" y="280" font-family="Liberation Sans" font-weight="bold" font-size="22" fill="#E24A12" stroke="#E24A12" stroke-width="1.0" stroke-linejoin="round" text-anchor="start">RULE 2.1 · PLAYING FIELD</text>
<text x="90" y="354" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">The playing field is a rectangular area</text>
<text x="90" y="404" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">with dimensions and zones as shown on</text>
<text x="90" y="454" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">Figure 1 (see above) and should be</text>
<text x="90" y="504" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">essentially flat, free of obstructions and</text>
<text x="90" y="554" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">afford reasonable player safety.</text>
<text x="90" y="666" font-family="Liberation Sans" font-weight="bold" font-size="22" fill="#E24A12" stroke="#E24A12" stroke-width="1.0" stroke-linejoin="round" text-anchor="start">RULE 2.2 · PLAYING FIELD</text>
<text x="90" y="740" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">The perimeter lines surround the playing</text>
<text x="90" y="790" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">field and consist of two (2) sidelines</text>
<text x="90" y="840" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">along the length and two (2) endlines along</text>
<text x="90" y="890" font-family="Liberation Sans" font-weight="normal" font-size="38" fill="#F1F3EE" opacity="0.92" text-anchor="start">the width.</text></g></svg>
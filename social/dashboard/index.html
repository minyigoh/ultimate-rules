    return `<div class="step ${cls}" style="--sc:${s.color}"><b>${s.n}</b><span>${esc(s.label)}</span></div>`;
  }).join('') + '</div>';
}

/* One decision, one row. Rendered newest-first under the track it belongs to,
   so "what did I already say about this, and about which version" is readable
   without opening a markdown file in the repo. Rows whose version has been
   superseded are struck through rather than dropped -- the point of keeping
   history is that a withdrawn approval is still a thing you once said. */
function historyHTML(p, name){
  const rows = historyOf(p, name);
  if (!rows.length) return '';
  const cur  = name === 'script' ? scriptRevOf(p) : contentRevOf(p);
  const META = name === 'script' ? SCRIPT_STATUS : CONTENT_STATUS;
  const body = [...rows].reverse().map(r => {
    const m = META[r.status] || {label: r.status, color: 'var(--faint)'};
    const old = typeof r.rev === 'number' && r.rev < cur;
    const detail = [r.note, (r.tags || []).join(', ')].filter(Boolean).join(' \u00b7 ');
    const when = r.at ? new Date(r.at).toLocaleDateString(undefined,{day:'numeric',month:'short'}) : '';
    return `<div class="hrow${old ? ' superseded' : ''}">
      <span class="hv">v${esc(String(typeof r.rev === 'number' ? r.rev : '?'))}</span>
      <span class="hs" style="--hc:${m.color}">${esc(m.label)}</span>
      <span class="hn">${esc(detail)}</span>
      <span class="hd">${esc(when)}</span>
    </div>`;
  }).join('');
  return `<details class="hist"><summary>Decision history (${rows.length})</summary>${body}</details>`;
}

/* The imperative line at the top of a track body. `needOf` decides what the
   POST is waiting for; this decides whether that lands on this track. */
function needBlock(p, name){
  const need = needOf(p);
  if (need.on !== name) return `<div class="need quiet"><b>Nothing needed here.</b> ${
    name === 'script'
      ? 'These words are signed off, and nothing has changed them since.'
      : 'This track is not what the post is waiting on.'}</div>`;
  return `<div class="need" style="--nc:${need.color}"><b>${esc(need.title)}.</b> ${need.body}</div>`;
}

/* The banner across the top of the post. One post, one ask. */
function needBarHTML(p){
  const n = needOf(p);
  return `<div class="needbar${n.who === 'done' ? ' done' : ''}" style="--nc:${n.color}">
    <span class="ico">${esc(n.ico)}</span>
    <span class="txt"><b>${n.who === 'you' ? '' : n.who === 'task' ? 'On the render task: ' : ''}${esc(n.title)}</b>
    <span>${n.body}</span></span>
  </div>`;
}

function tracksHTML(p){
  const s = scriptStatus(p), c = contentStatus(p);
  const sStale = staleScript(p), cStale = staleContent(p);
  const sMeta = sMetaOf(p), cMeta = cMetaOf(p);
  const sRev = scriptRevOf(p), cRev = contentRevOf(p);

  /* ---- track 1: the words ----
     aria-pressed is gated on staleness. This is the fix Min-Yi actually asked
     for: an approval whose words have been replaced must not leave Approve
     sitting there lit, because a lit Approve reads as "done, nothing to do"
     and that is precisely the wrong thing to think. */
  const sBtns = [
    ['approved','Approve','var(--ok)'],
    ['changes','Request changes','var(--warn)'],
    ['rejected','Reject','var(--bad)']
  ].map(([k,l,col]) =>
    `<button class="act" data-track="script" data-set="${k}" style="--c:${col}" aria-pressed="${!sStale && s===k}">${esc(l)}</button>`
  ).join('');

  const sStaleBox = sStale ? `<div class="stale">
      <b>This approval has been withdrawn automatically.</b><br>
      You decided <span class="old">${esc(SCRIPT_STATUS[s].label)}</span> on
      <b>v${esc(String(revOf(track(p.id,'script') || baseline(p,'script'), sRev)))}</b>;
      the task has since redrafted to <b>v${sRev}</b>. Nothing was lost \u2014 the old
      decision is in the history below, and the previous copy is archived in the repo.
    </div>` : '';

  const scriptTrack = `
    <div class="track" style="--tc:${sMeta.color}">
      <div class="track-head">
        <span class="num">1</span><h4>Script approval</h4>
        <span class="pill" style="--st:${sMeta.color}"><span class="dot"></span>${esc(sMeta.label)}</span>
        <span class="chip" style="margin-left:auto">v${sRev}</span>
      </div>
      <p class="what">The words \u2014 hook, explanation, example, CTA. Approving this
      is what puts the post into the render queue.</p>
      ${needBlock(p,'script')}
      ${sStaleBox}
      <div class="acts">${sBtns}
        ${state[p.id] && state[p.id].script ? '<button class="act ghost" data-revert="script">Revert</button>' : ''}
      </div>
      <textarea data-note="script" placeholder="Line edits, tone, a rule that needs re-checking\u2026">${esc(scriptNote(p))}</textarea>
      <div class="saved" data-saved="script">${savedLabel(p,'script')}</div>
      <p class="repo-note">Repo says: <b>${esc(SCRIPT_STATUS[baseline(p,'script').status].label)}</b>${repoNote(p,'script') ? ' (' + esc(repoNote(p,'script')) + ')' : ''}</p>
      ${historyHTML(p,'script')}
    </div>`;

  /* ---- track 2: the cut that came out ---- */
  let contentBody;
  if (effScript(p) !== 'approved'){
    // A cut can be sitting right below this message and still not be judgeable:
    // reel-32's was built on 2026-09-04 from words that were never approved.
    // Say so here, because this is the branch that renders for that post.
    const orphan = hasMedia(p) ? builtFromUnapprovedScript(p) : null;
    contentBody = `<div class="lockmsg"><b>Waiting on the script.</b> Nothing gets
      rendered until track 1 is approved, so there's no content to judge yet.${
      sStale ? ' The words were redrafted after your last decision, so track 1 is open again.' : ''}${
      orphan === null ? '' : ` <b style="color:var(--accent)">There is already a cut below, and it was built from
      script v${orphan} \u2014 words you never approved.</b> Read track 1 first. If you approve those words the cut
      stands and moves here for review; if you ask for changes it gets rebuilt.`}</div>`;
  } else if (!hasMedia(p)){
    contentBody = `<div class="lockmsg"><b>In the render queue.</b> The scheduled
      run picks this up because its script is approved. Once a file lands here,
      this is where you approve or send it back.</div>`;
  } else {
    /* Three buttons, not two. "Reject" used to have to carry two completely
       different asks -- "build this again properly" and "these are the wrong
       words" -- and on 2026-09-04 Min-Yi used it for the second, three times
       in forty seconds, because there was nothing else to press. The render
       task guessed the routing correctly and wrote that guess into a markdown
       file she had no reason to open. Now the ask names itself. */
    const cBtns = [
      ['approved','Approve \u2014 ready to post','var(--ok)'],
      ['rerender','Send back \u2014 rebuild it','var(--accent)'],
      ['to-script','Send back \u2014 wrong words','var(--warn)']
    ].map(([k,l,col]) =>
      `<button class="act" data-track="content" data-set="${k}" style="--c:${col}" aria-pressed="${!cStale && c===k}">${esc(l)}</button>`
    ).join('');

    const tags = contentTags(p);
    const fb = c === 'rerender' ? `
      <div class="fb">
        <div class="lb">What should the re-render fix?</div>
        <div class="issues">${ISSUES.map(t =>
          `<button class="issue" data-issue="${esc(t)}" aria-pressed="${tags.includes(t)}">${esc(t)}</button>`
        ).join('')}</div>
        <label class="urgent">
          <input type="checkbox" data-urgent ${isUrgent(p) ? 'checked' : ''}>
          <span>Regenerate on the next run, don't wait for tomorrow's schedule</span>
        </label>
      </div>` : '';

    const cStaleBox = cStale ? `<div class="stale">
        <b>This decision has been withdrawn automatically.</b><br>
        You decided <span class="old">${esc(CONTENT_STATUS[c].label)}</span> on
        <b>v${esc(String(revOf(track(p.id,'content') || baseline(p,'content'), cRev)))}</b>;
        <b>v${cRev}</b> has been rendered since. The player above is showing the new one.
      </div>` : '';

    const unapproved = builtFromUnapprovedScript(p);
    const warnBox = unapproved === null ? '' : `<div class="stale">
        <b>This cut was built from a script you never approved.</b><br>
        It was rendered from script <b>v${esc(String(unapproved))}</b>, and your approval on track 1
        belongs to a different version. Read the words on track 1 before judging the cut \u2014 the
        render guard added on 2026-09-04 refuses this now, but this cut predates it.
      </div>`;

    contentBody = `
      ${needBlock(p,'content')}
      ${cStaleBox}${warnBox}
      <div class="acts">${cBtns}
        ${state[p.id] && state[p.id].content ? '<button class="act ghost" data-revert="content">Revert</button>' : ''}
      </div>
      <textarea data-note="content" placeholder="${c === 'rerender'
        ? 'What&#39;s wrong with this cut, specifically \u2014 this text is handed to the render task.'
        : 'Notes on the rendered cut\u2026'}">${esc(contentNote(p))}</textarea>
      <div class="saved" data-saved="content">${savedLabel(p,'content')}</div>
      ${fb}`;
  }

  const blocked = effScript(p) !== 'approved';
  const cPill = blocked ? {label:'Waiting on the script', color:'var(--faint)'} : cMeta;
  const contentTrack = `
    <div class="track ${blocked || !hasMedia(p) ? 'locked' : ''}" style="--tc:${cMeta.color}">
      <div class="track-head">
        <span class="num">2</span><h4>Content approval</h4>
        <span class="pill" style="--st:${cPill.color}"><span class="dot"></span>${esc(cPill.label)}</span>
        ${cRev ? `<span class="chip" style="margin-left:auto">v${cRev}</span>` : ''}
      </div>
      <p class="what">The rendered cut \u2014 pacing, on-screen text, visuals. Send it back to
      <b>rebuild</b> when the build is wrong, or back to the <b>script</b> when the words are.</p>
      ${contentBody}
      <p class="repo-note">Repo says: <b>${esc(CONTENT_STATUS[baseline(p,'content').status].label)}</b>${repoNote(p,'content') ? ' (' + esc(repoNote(p,'content')) + ')' : ''}</p>
      ${historyHTML(p,'content')}
    </div>`;

  const posted = postedOn(p);
  const markBtn = (effContent(p) === 'approved' || posted)
    ? `<div style="margin-bottom:26px"><button class="act" data-posted style="--c:var(--text)" aria-pressed="${!!posted}">
         ${posted ? 'Posted ' + esc(posted) : 'Mark as posted'}</button>
       <div class="saved" data-saved="posted">${savedLabel(p,'posted')}</div></div>`
    : '';

  return `<div class="tracks">${scriptTrack}${contentTrack}</div>${markBtn}`;
}

function savedLabel(p, name){
  const t = track(p.id, name);
  if (t && t.updatedAt){
    const when = new Date(t.updatedAt).toLocaleString();
    if (!SYNC_URL) return 'Saved locally ' + when;
    if (syncing.has(p.id+':'+name)) return 'Saved locally ' + when + ' — syncing…';
    /* A successful sync deliberately keeps the local copy — raw.githubusercontent
       lags a push by minutes, so dropping it here would let a reload read the
       stale file and show the old text. But "not yet synced" then contradicted
       the toast that had just said it was, and stayed wrong until the next
       boot reconciled it. The Worker's receipt is what the label should
       report. */
    if (confirmed(t)) return 'Synced to repo ' + new Date(t.syncedAt).toLocaleString();
    return 'Saved locally ' + when + ' — not yet synced';
  }
  const r = remoteState[p.id] && remoteState[p.id][name];
  return r && r.updatedAt ? 'Synced to repo ' + new Date(r.updatedAt).toLocaleString() : '';
}

function revisionsHTML(p){
  const revs = revisionsOf(p);
  if (revs.length < 1) return '';
  const latest = revs[revs.length - 1];

  const rows = [...revs].reverse().map(r => {
    const url = revisionURL(p, r);
    const isLatest = r === latest;
    return `<div class="rev${isLatest ? ' now' : ''}">
      <div class="revh">
        <b>v${esc(String(r.v))}</b>
        ${isLatest ? '<span class="pill" style="--st:var(--ok)">Latest</span>'
                   : '<span class="pill" style="--st:var(--faint)">Superseded</span>'}
        ${r.renderedAt ? `<span class="chip">${esc(r.renderedAt)}</span>` : ''}
        ${r.duration ? `<span class="chip">${esc(r.duration)}</span>` : ''}
        ${url && p.video ? `<button class="copy" data-rev="${esc(url)}">Preview</button>` : ''}
      </div>
      <div class="revwhat">${esc(r.changed || 'No description recorded.')}</div>
    </div>`;
  }).join('');

  return `<section><h3>Revisions</h3>${rows}
    ${revs.length === 1
      ? '<p class="src" style="margin-top:10px">Only one cut so far. Rejecting it logs the next round here.</p>'
      : ''}</section>`;
}

function captionCard(platform, text){
  return `<div class="caption-card">
    <div class="ch"><b>${esc(platform)}</b><span class="len">${text.length} chars</span>
      <button class="copy" data-copy="${esc(platform)}">Copy</button></div>
    <pre>${esc(text)}</pre>
  </div>`;
}

/* ---------- mutations ---------- */
function entry(p){
  return state[p.id] || (state[p.id] = {});
}

/* A local override to mutate, seeded from whatever is currently in effect.
   Critical once syncing is on: a successful sync deletes the local override
   (it lives in the repo now), so the next edit would otherwise start from a
   blank object and silently drop the note or tags already recorded. */
function mutableTrack(p, name){
  const d = entry(p);
  if (!d[name]){
    d[name] = name === 'script'
      ? {status: scriptStatus(p), note: scriptNote(p), rev: scriptRevOf(p)}
      : name === 'posted'
      ? {status: postedOn(p) ? 'posted' : 'unposted', date: postedOn(p) || null}
      : {status: contentStatus(p), note: contentNote(p), rev: contentRevOf(p),
         tags: contentTags(p).slice(), urgent: isUrgent(p)};
  }
  // You are looking at the current version, so anything you touch now is a
  // judgement on it -- including a note typed onto a decision made earlier.
  if (name === 'script')  d[name].rev = scriptRevOf(p);
  if (name === 'content') d[name].rev = contentRevOf(p);
  return d[name];
}
function tidy(p){
  /* Drop anything that has drifted back to matching the repo, so "unsaved"
     means what it says. */
  const d = state[p.id];
  if (!d) return;
  /* A local track that matches the repo is noise -- EXCEPT when it re-stamps a
     version. Re-approving a redrafted script leaves the status where the repo
     already has it ("approved") and changes only the rev; dropping it as a
     no-op would silently discard the re-approval and leave the desk asking for
     it forever. Compare the stamp, not just the word. */
  const sameRev = (a, b) => (typeof a.rev === 'number' ? a.rev : null)
                         === (typeof b.rev === 'number' ? b.rev : null);
  if (d.script && d.script.status === baseline(p,'script').status &&
      sameRev(d.script, baseline(p,'script')) && !(d.script.note||'').trim()) delete d.script;
  if (d.content && d.content.status === baseline(p,'content').status &&
      sameRev(d.content, baseline(p,'content')) &&
      !(d.content.note||'').trim() && !(d.content.tags||[]).length && !d.content.urgent) delete d.content;
  if (d.posted && samePosted(d.posted, baseline(p,'posted'))) delete d.posted;
  if (!Object.keys(d).length) delete state[p.id];
}
function commit(p, msg){
  tidy(p); save(); renderStats(); renderFilters(); renderList(); renderDetail(true);
  if (msg) toast(msg);
}

/* "The words are wrong" is not "build it again". It fails the cut AND reopens
   the script gate, in one commit, with your note carried onto the track that
   will act on it. Before this existed the only way to say it was Reject, which
   said the wrong thing, and the render task had to infer the rest. */
function sendBackToScript(p){
  const note = (contentNote(p) || '').trim();
  if (!note){
    toast('Say what is wrong with the words first — the note is what gets rewritten');
    const ta = $('#detail').querySelector('[data-note="content"]');
    if (ta) ta.focus();
    return;
  }
  const cont = mutableTrack(p, 'content');
  cont.status = 'rerender';
  cont.tags = cont.tags || [];
  if (!cont.tags.includes('On-screen text')) cont.tags.push('On-screen text');
  cont.updatedAt = Date.now();

  const scr = mutableTrack(p, 'script');
  scr.status = 'changes';
  scr.note = note;
  scr.updatedAt = Date.now();

  clearFlow(p.id);
  commit(p, 'Sent back to the script — the words get rewritten before anything renders again');
  // One request, one commit, both tracks. Two separate POSTs would race each
  // other on the branch ref and could leave the cut failed with the script
  // still approved -- the exact half-state this button exists to prevent.
  syncToRepo(p, 'content', cont, 'Sent back to the script', {track:'script', value: scr});
}

function setTrack(p, name, status){
  if (name === 'content' && status === 'to-script') return sendBackToScript(p);
  const now = name === 'script' ? scriptStatus(p) : contentStatus(p);
  const stale = name === 'script' ? staleScript(p) : staleContent(p);
  const cur = mutableTrack(p, name);
  const base = baseline(p, name).status;
  // Clicking the status a track already holds normally means "undo, put it back
  // to what the repo says". Not when the decision is stale: there the button
  // was not lit, so the click is a fresh decision about the new version and
  // toggling it off would be the opposite of what was asked.
  cur.status = (status === now && !stale) ? base : status;
  cur.note = cur.note || '';
  cur.updatedAt = Date.now();
  if (name === 'content'){
    cur.tags = cur.tags || [];
    if (cur.status !== 'rerender'){ cur.tags = []; cur.urgent = false; }
    // Whatever was saved to the phone is about to be superseded by a new cut.
    if (cur.status === 'rerender') clearFlow(p.id);
  }
  const label = name === 'script' ? SCRIPT_STATUS[cur.status].label : CONTENT_STATUS[cur.status].label;
  const ver = name === 'script' ? scriptRevOf(p) : contentRevOf(p);
  commit(p, (name === 'script' ? 'Script: ' : 'Content: ') + label + (ver ? ' (v' + ver + ')' : ''));
  syncToRepo(p, name, cur);
}

function wireDetail(p){
  const back = $('#backBtn');
  if (back) back.addEventListener('click', backToQueue);

  const saveBtn = $('#saveBtn');
  if (saveBtn) saveBtn.addEventListener('click', async () => {
    if (await saveToPhone(p, saveBtn)){ markFlow(p.id, 'saved'); renderDetail(true); }
  });

  $('#detail').querySelectorAll('[data-flow]').forEach(b => {
    b.addEventListener('click', async () => {
      const k = b.dataset.flow;
      if (k === 'save'){
        if (await saveToPhone(p, b)){ markFlow(p.id, 'saved'); renderDetail(true); }
      } else if (k === 'copy'){
        copyCaption(p, p.tiktok ? capTarget : 'Instagram');
      } else {
        markPosted(p);
      }
    });
  });

  // Preview swaps only what the player shows. Saving stays pinned to the
  // latest cut regardless of what you're currently watching.
  $('#detail').querySelectorAll('[data-rev]').forEach(b => {
    b.addEventListener('click', () => {
      const v = $('#detail').querySelector('video');
      if (!v) return;
      v.src = b.dataset.rev;
      v.load();
      v.play().catch(() => {});
      v.scrollIntoView({behavior:'smooth', block:'center'});
      $('#detail').querySelectorAll('[data-rev]').forEach(x =>
        x.textContent = x === b ? 'Playing' : 'Preview');
    });
  });

  $('#detail').querySelectorAll('[data-set]').forEach(b => {
    b.addEventListener('click', () => setTrack(p, b.dataset.track, b.dataset.set));
  });

  $('#detail').querySelectorAll('[data-revert]').forEach(b => {
    b.addEventListener('click', () => {
      const name = b.dataset.revert;
      if (state[p.id]) delete state[p.id][name];
      commit(p, 'Reverted ' + name + ' to repo');
    });
  });

  $('#detail').querySelectorAll('[data-issue]').forEach(b => {
    b.addEventListener('click', () => {
      const c = mutableTrack(p, 'content');
      c.tags = c.tags || [];
      const t = b.dataset.issue;
      const i = c.tags.indexOf(t);
      if (i === -1) c.tags.push(t); else c.tags.splice(i, 1);
      c.updatedAt = Date.now();
      commit(p);
      syncToRepo(p, 'content', c);
    });
  });

  const urg = $('#detail').querySelector('[data-urgent]');
  if (urg) urg.addEventListener('change', () => {
    const c = mutableTrack(p, 'content');
    c.urgent = urg.checked;
    c.updatedAt = Date.now();
    commit(p, urg.checked ? 'Flagged for the next run' : 'Back on the normal schedule');
    syncToRepo(p, 'content', c);
  });

  const mark = $('#detail').querySelector('[data-posted]');
  if (mark) mark.addEventListener('click', () => markPosted(p));

  $('#detail').querySelectorAll('[data-note]').forEach(ta => {
    const name = ta.dataset.note;
    ta.addEventListener('input', () => {
      // Straight into state, every keystroke. Nothing here repaints, so it
      // costs nothing — and it means any repaint that does land renders the
      // sentence as it stands rather than as it stood a second ago.
      const cur = mutableTrack(p, name);
      cur.note = ta.value;
      cur.updatedAt = Date.now();
      queueNote(p, name);
    });
    ta.addEventListener('compositionstart', () => { composingNote = true; });
    ta.addEventListener('compositionend', () => {
      composingNote = false;
      if (pendingDetail) renderDetail(true);
    });
    ta.addEventListener('blur', () => flushNote(p, name));
  });

  $('#detail').querySelectorAll('[data-copy]').forEach(b => {
    b.addEventListener('click', () => copyCaption(p, b.dataset.copy));
  });

  $('#detail').querySelectorAll('[data-cap]').forEach(b => {
    b.addEventListener('click', () => {
      if (b.dataset.cap === capTarget) return;
      setCapTarget(b.dataset.cap);
      // The clipboard still holds the other platform's words, so step 2 is
      // owed again for the one just picked.
      unmarkFlow(p.id, 'copied');
      renderDetail(true);
    });
  });

  $('#detail').querySelectorAll('img[data-full]').forEach(img => {
    img.addEventListener('click', () => {
      $('#lightboxImg').src = img.dataset.full;
      $('#lightboxImg').alt = img.alt;
      $('#lightbox').showModal();
    });
  });
}

/* ---------- render queue modal ---------- */
$('#queueBtn').addEventListener('click', () => {
  const q = renderQueue();
  $('#modalTitle').textContent = 'Render queue';

  let body = `<p class="hint">What a scheduled run would pick up, in the order it
    should touch them. This is derived from your approvals — it is not a live
    feed, and the task only sees it once these decisions reach the repo.</p>`;

  if (!q.length){
    body += `<div class="lockmsg">Nothing queued. Every approved script has a
      rendered cut, and no cut has been sent back.</div>`;
  } else {
    body += q.map(x => {
      const p = x.post;
      const why = x.action === 'render'
        ? 'Script approved, no cut rendered yet.'
        : 'Cut sent back' + (x.tags.length ? ' — <em>' + x.tags.map(esc).join(', ') + '</em>' : '') + '.';
      return `<div class="rq">
        <div class="rqh">
          <b>${esc(p.title)}</b>
          <span class="chip">${esc(p.date)}</span>
          <span class="chip">${esc(p.type)}</span>
          <span class="pill" style="--st:${x.action === 'render' ? 'var(--info)' : 'var(--accent)'}">
            ${x.action === 'render' ? 'Render' : 'Re-render'}</span>
          ${x.urgent ? '<span class="pill" style="--st:var(--bad)">Next run</span>' : ''}
          ${x.posted ? '<span class="pill" style="--st:var(--warn)">Already posted</span>' : ''}
        </div>
        <div class="why">${why}${x.note ? '<br>' + esc(x.note) : ''}</div>
      </div>`;
    }).join('');
  }

  $('#modalBody').innerHTML = body;
  // No "copy JSON" here any more: the render task reads calendar.md and
  // feedback.md, both of which the Worker keeps current, so a hand-carried
  // render-queue.json was a second source of truth nothing consumed.
  $('#modalFoot').innerHTML =
    `<button class="hbtn" data-close style="margin-left:auto">Close</button>`;
  $('#modal').showModal();
});

/* ---------- unsynced decisions ----------
   This replaced "Export decisions", which existed when the desk had no way to
   reach the repo: it printed a calendar table and feedback blocks for you to
   paste back by hand. The Worker now writes calendar.md, review-state.json and
   feedback.md itself on every click, so all of that was not just redundant but
   actively misleading — it opened by telling you a scheduled task could not
   see your decisions, which stopped being true.

   What remains is the failure case: offline, a wrong passphrase, the Worker
   down. Those decisions sit in localStorage, get retried on next load, and
   this is where you can see and force them. The button stays hidden while
   there is nothing to show. */
function unsyncedPosts(){
  return SYNC_URL ? POSTS.filter(overridden) : [];
}

function describePending(p){
  const bits = [];
  if (scriptStatus(p) !== baseline(p,'script').status || staleScript(p) || scriptNote(p).trim())
    bits.push(`script → ${sMetaOf(p).label}` +
              (scriptNote(p).trim() ? ` (“${scriptNote(p).trim()}”)` : ''));
  if (contentStatus(p) !== baseline(p,'content').status || staleContent(p) || contentNote(p).trim() || contentTags(p).length)
    bits.push(`content → ${cMetaOf(p).label}` +
              (contentTags(p).length ? ` [${contentTags(p).join(', ')}]` : '') +
              (contentNote(p).trim() ? ` (“${contentNote(p).trim()}”)` : ''));
  if (postedOn(p) !== p.postedDate)
    bits.push(postedOn(p) ? `marked posted ${postedOn(p)}` : 'un-marked as posted');
  return bits;
}

$('#unsyncedBtn').addEventListener('click', () => {
  const pending = unsyncedPosts();
  $('#modalTitle').textContent = 'Unsynced decisions';

  if (!pending.length){
    $('#modalBody').innerHTML = `<div class="lockmsg">Everything is synced.</div>`;
  } else {
    $('#modalBody').innerHTML = `
      <p class="hint">These never reached the repo — usually no connection, or a
        wrong passphrase. They're kept in this browser and retried automatically
        each time the desk loads. <b>Retry now</b> forces another attempt; the
        text below is a last resort if it keeps failing.</p>
      ${pending.map(p => `<div class="rq">
        <div class="rqh"><b>${esc(p.title)}</b>
          <span class="chip">${esc(postLabel(p))}</span>
          <span class="chip">${esc(p.date)}</span></div>
        <div class="why">${describePending(p).map(esc).join('<br>')}</div>
      </div>`).join('')}`;
  }

  $('#modalFoot').innerHTML = pending.length
    ? `<button class="hbtn primary" id="retrySync">Retry now</button>
       <button class="hbtn" id="cpPending">Copy as text</button>
       <button class="hbtn" data-close style="margin-left:auto">Close</button>`
    : `<button class="hbtn" data-close style="margin-left:auto">Close</button>`;

  const retry = $('#retrySync');
  if (retry) retry.onclick = () => { syncSweep(); $('#modal').close(); };
  const cp = $('#cpPending');
  if (cp) cp.onclick = () => copy(
    pending.map(p => `${p.date} — ${p.title} (${postLabel(p)})\n  ` +
                     describePending(p).join('\n  ')).join('\n\n'),
    'Pending decisions');

  $('#modal').showModal();
});

$('#briefBtn').addEventListener('click', () => {
  $('#modalTitle').textContent = 'Brand brief';
  $('#modalBody').innerHTML = `
    <p class="hint"><b>${esc(ACCOUNT.name)}</b> ${esc(ACCOUNT.handle)}<br>${esc(ACCOUNT.bio)}</p>
    <p class="hint"><b>Cadence.</b> ${esc(ACCOUNT.cadence)}</p>
    <p class="hint"><b>Voice.</b> Calm-coach with dry wit. Explain the rule, then the why, then a concrete example. Rule numbers as receipts. No overselling, no growth promises.</p>
    <p class="hint"><b>Palette.</b>
      <span class="tag" style="background:#0F1712;color:#F1F3EE;border:1px solid var(--line)">#0F1712 bg</span>
      <span class="tag" style="background:#F1F3EE;color:#0F1712">#F1F3EE text</span>
      <span class="tag" style="background:#E24A12;color:#fff">#E24A12 accent</span>
    </p>
    <p class="hint"><b>Attribution (non-negotiable, every post).</b> ${esc(ACCOUNT.attribution)}</p>
    <p class="hint">Full spec: <span class="src">social/brand-identity.md</span> · carousel system: <span class="src">content/CAROUSEL_TEMPLATE.md</span></p>`;
  $('#modalFoot').innerHTML = `<button class="hbtn" data-close style="margin-left:auto">Close</button>`;
  $('#modal').showModal();
});

document.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) e.target.closest('dialog').close();
});
$('#lightbox').addEventListener('click', () => $('#lightbox').close());

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if (e.key === '/' && !typing){ e.preventDefault(); $('#search').focus(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  const items = sortForQueue(visible());   // must match what the queue displays
  if (!items.length) return;
  e.preventDefault();
  const i = items.findIndex(p => p.id === selected);
  const next = e.key === 'ArrowDown'
    ? items[Math.min(i + 1, items.length - 1)] || items[0]
    : items[Math.max(i - 1, 0)] || items[0];
  select(next.id);
  const card = $('#list').querySelector(`.card[data-id="${next.id}"]`);
  if (card) card.scrollIntoView({block:'nearest'});
});

/* ---------- boot ---------- */
(async function boot(){
  await loadRemoteState();
  reconcileRemote();
  renderStats();
  renderFilters();
  renderList();
  const first = POSTS.find(p => stageOf(p) === 'content-review')
    || POSTS.find(p => stageOf(p) === 'script-review')
    || POSTS.find(p => p.date === TODAY)
    || POSTS.find(p => p.date >= TODAY)
    || POSTS[0];
  select(first.id);
  syncSweep();
})();
</script>

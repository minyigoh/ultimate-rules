<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F1712">
<meta name="color-scheme" content="dark">
<title>Content Desk — Learn Ultimate Frisbee</title>
<style>
:root{
  --bg:#0F1712;
  --panel:#141F19;
  --panel-2:#1A271F;
  --line:rgba(241,243,238,.11);
  --line-strong:rgba(241,243,238,.2);
  --text:#F1F3EE;
  --muted:rgba(241,243,238,.58);
  --faint:rgba(241,243,238,.38);
  --accent:#E24A12;
  --ok:#4CAF7D;
  --warn:#E0A32E;
  --bad:#D4553F;
  --info:#4A9E8F;
  --radius:12px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}

/* ---------- header ---------- */
header{
  border-bottom:1px solid var(--line);
  padding:18px 24px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  background:linear-gradient(180deg,rgba(226,74,18,.06),transparent);
}
.brand{display:flex;align-items:center;gap:13px;margin-right:auto}
.brand img{width:44px;height:44px;border-radius:50%;background:#000;object-fit:cover;flex:none}
.brand .fallback{width:44px;height:44px;border-radius:50%;background:var(--accent);display:none;place-items:center;font-weight:700;flex:none}
.brand h1{margin:0;font-size:16px;font-weight:650;letter-spacing:-.01em}
.brand p{margin:1px 0 0;font-size:12.5px;color:var(--muted)}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:7px 13px;min-width:86px;
}
.stat b{display:block;font-size:19px;font-weight:650;line-height:1.15}
.stat span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint)}
.stat.hl{border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.stat.hl b{color:var(--accent)}
.hbtn{
  background:var(--panel);border:1px solid var(--line-strong);border-radius:9px;
  padding:9px 15px;font-size:13px;font-weight:550;
}
.hbtn:hover{border-color:var(--accent);color:var(--accent)}
.hbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.hbtn.primary:hover{filter:brightness(1.12);color:#fff}
.hbtn .badge{
  display:inline-block;background:var(--accent);color:#fff;border-radius:20px;
  font-size:11px;font-weight:700;padding:0 6px;margin-left:6px;
}
.hbtn.primary .badge{background:rgba(0,0,0,.28)}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:340px minmax(0,1fr);height:calc(100vh - 83px)}
.backbar{display:none}
/* The narrow-screen block lives at the very end of this stylesheet — it has to
   come after every rule it overrides, or the base rules win on equal
   specificity and the mobile layout silently reverts to the desktop one. */

/* ---------- queue ---------- */
.queue{border-right:1px solid var(--line);overflow-y:auto;padding:14px}
.filters{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.filters button{
  background:transparent;border:1px solid var(--line);border-radius:20px;
  padding:5px 11px;font-size:12px;color:var(--muted);
}
.filters button:hover{border-color:var(--line-strong);color:var(--text)}
.filters button[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.filters button .n{opacity:.6;margin-left:3px}
.search{
  width:100%;background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:9px 12px;color:var(--text);font:inherit;font-size:13px;margin-bottom:12px;
}
.search:focus{outline:none;border-color:var(--accent)}
.daygroup{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);margin:16px 0 7px;font-weight:600}
.daygroup:first-of-type{margin-top:4px}

.card{
  display:block;width:100%;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-left:3px solid var(--st);
  border-radius:var(--radius);padding:11px 13px;margin-bottom:7px;
  transition:border-color .12s,background .12s;
}
.card:hover{background:var(--panel-2);border-color:var(--line-strong);border-left-color:var(--st)}
.card[aria-current=true]{background:var(--panel-2);border-color:var(--accent);border-left-color:var(--st)}
.card .top{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.card .date{font:600 11px/1 var(--mono);color:var(--faint);letter-spacing:.02em}
.card .kind{
  font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:650;
  color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:2px 5px;
}
.card .today{background:var(--accent);color:#fff;border-color:var(--accent)}
.card h3{margin:0 0 7px;font-size:13.5px;font-weight:550;line-height:1.35}
.card .foot{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.edited{font-size:10px;color:var(--accent);font-weight:600}

/* two-segment track indicator on each card */
.tt{display:flex;gap:3px;align-items:center}
.tt i{
  width:22px;height:4px;border-radius:2px;background:var(--c);display:block;
  font-style:normal;
}
.tt i.empty{background:var(--line-strong)}

.pill{
  display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:650;
  text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:20px;
  background:color-mix(in srgb,var(--st) 17%,transparent);color:var(--st);
  border:1px solid color-mix(in srgb,var(--st) 32%,transparent);white-space:nowrap;
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--st);flex:none}

/* ---------- detail ---------- */
/* The bottom padding is deliberately small: a sticky element can only travel to
   the bottom of its containing block, which stops at the padding edge, so a
   generous pad here would leave the flow bar floating in the middle of nowhere.
   Sections carry their own 30px of tail margin instead. */
.detail{overflow-y:auto;padding:26px 32px 22px}
.empty{display:grid;place-content:center;height:60vh;text-align:center;color:var(--faint)}
.empty .disc{font-size:44px;margin-bottom:12px}

.dhead{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:22px}
.dhead h2{margin:0 0 10px;font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.2;max-width:24ch}
.meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{
  font-size:11.5px;color:var(--muted);background:var(--panel);
  border:1px solid var(--line);border-radius:6px;padding:3px 9px;
}
.chip b{color:var(--text);font-weight:600}
.chip.rule{font-family:var(--mono);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);font-size:11px}

.flag{
  display:flex;gap:10px;background:color-mix(in srgb,var(--warn) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);
  border-radius:var(--radius);padding:12px 14px;margin-top:16px;font-size:13px;color:var(--text);
}
.flag .ico{color:var(--warn);font-weight:700;flex:none}

/* pipeline rail */
.rail{display:flex;gap:4px;margin-bottom:22px}
.rail .step{
  flex:1;text-align:center;font-size:10px;text-transform:uppercase;
  letter-spacing:.06em;font-weight:650;color:var(--faint);
  padding:7px 4px;border-radius:7px;background:var(--panel);
  border:1px solid var(--line);position:relative;
}
.rail .step.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.rail .step.now{
  color:var(--bg);background:var(--sc);border-color:var(--sc);
}
.rail .step b{display:block;font-size:15px;line-height:1.1;margin-bottom:2px;font-weight:700}

/* two approval tracks */
.tracks{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
.track{
  background:var(--panel);border:1px solid var(--line);
  border-top:3px solid var(--tc);border-radius:var(--radius);padding:16px;
  display:flex;flex-direction:column;
}
.track.locked{opacity:.62}
.track-head{display:flex;align-items:center;gap:9px;margin-bottom:6px;flex-wrap:wrap}
.track-head .num{
  width:20px;height:20px;border-radius:50%;background:var(--tc);color:var(--bg);
  display:grid;place-items:center;font-size:11px;font-weight:750;flex:none;
}
.track-head h4{margin:0;font-size:13.5px;font-weight:650;letter-spacing:-.01em}
.track .what{font-size:12px;color:var(--faint);margin:0 0 13px;line-height:1.45}
.track .repo-note{font-size:11px;color:var(--faint);margin-top:10px}
.track .repo-note b{color:var(--muted)}

.acts{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
.act{
  background:transparent;border:1px solid var(--line-strong);border-radius:9px;
  padding:8px 13px;font-size:12.5px;font-weight:550;display:flex;align-items:center;gap:6px;
}
.act:hover{border-color:var(--c);color:var(--c)}
.act[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#0F1712;font-weight:650}
.act:disabled{opacity:.4;cursor:not-allowed}
.act.ghost{border-color:transparent;color:var(--faint);font-weight:450;font-size:12px}
.act.ghost:hover{color:var(--text);border-color:var(--line)}

.track textarea{
  width:100%;min-height:66px;resize:vertical;background:var(--bg);
  border:1px solid var(--line);border-radius:9px;padding:10px 12px;
  color:var(--text);font:inherit;font-size:13px;line-height:1.5;
}
.track textarea:focus{outline:none;border-color:var(--accent)}
.saved{font-size:11px;color:var(--muted);margin-top:7px;min-height:14px}

.lockmsg{
  font-size:12.5px;color:var(--muted);background:var(--bg);border:1px dashed var(--line-strong);
  border-radius:9px;padding:12px 13px;line-height:1.5;
}
.lockmsg b{color:var(--text)}

/* re-render feedback block */
.fb{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.fb > .lb{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:650;margin-bottom:8px}
.issues{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:11px}
.issue{
  background:transparent;border:1px solid var(--line);border-radius:20px;
  padding:4px 10px;font-size:11.5px;color:var(--muted);
}
.issue:hover{border-color:var(--accent);color:var(--text)}
.issue[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.urgent{display:flex;align-items:center;gap:9px;margin-top:11px;font-size:12.5px;color:var(--muted);cursor:pointer}
.urgent input{accent-color:var(--accent);width:16px;height:16px;flex:none;cursor:pointer}

/* ---------- what this post needs from YOU ----------
   The desk used to answer "what state is this in?" and leave you to work out
   what that meant you should do. On 2026-09-04 reel-30 sat at "Script approved"
   with Approve still lit, three minutes after the task had replaced the words
   that approval was about. A status noun cannot say that. These say the action,
   in the imperative, and they are the first thing on the post. */
.needbar{
  display:flex;gap:12px;align-items:flex-start;
  background:color-mix(in srgb,var(--nc) 11%,transparent);
  border:1px solid color-mix(in srgb,var(--nc) 38%,transparent);
  border-left:4px solid var(--nc);
  border-radius:var(--radius);padding:13px 15px;margin-bottom:20px;
}
.needbar .ico{color:var(--nc);font-weight:750;font-size:15px;line-height:1.4;flex:none}
.needbar .txt{min-width:0}
.needbar .txt > b{display:block;font-size:14px;font-weight:650;color:var(--text);margin-bottom:3px;line-height:1.35}
.needbar .txt > span{font-size:12.5px;color:var(--muted);line-height:1.5;display:block}
.needbar .txt span b{color:var(--nc);font-weight:650}

.need{
  font-size:12.5px;line-height:1.5;color:var(--text);
  background:color-mix(in srgb,var(--nc) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--nc) 32%,transparent);
  border-radius:9px;padding:9px 11px;margin-bottom:11px;
}
.need b{color:var(--nc);font-weight:650}
.need.quiet{background:var(--bg);border-color:var(--line);color:var(--muted)}
.need.quiet b{color:var(--muted)}

/* a decision the version moved out from under */
.stale{
  font-size:12px;line-height:1.5;color:var(--text);
  background:color-mix(in srgb,var(--accent) 13%,transparent);
  border:1px dashed color-mix(in srgb,var(--accent) 48%,transparent);
  border-radius:9px;padding:9px 11px;margin-bottom:11px;
}
.stale b{color:var(--accent);font-weight:650}
.stale .old{color:var(--faint);text-decoration:line-through}

/* per-track decision history */
.hist{border-top:1px solid var(--line);margin-top:12px;padding-top:9px}
.hist summary{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);
  font-weight:650;cursor:pointer;list-style:none;
}
.hist summary::-webkit-details-marker{display:none}
.hist summary::before{content:'\25B8  '}
.hist[open] summary::before{content:'\25BE  '}
.hist summary:hover{color:var(--text)}
.hrow{
  display:flex;gap:8px;align-items:baseline;padding:7px 0;
  border-bottom:1px solid var(--line);font-size:12px;line-height:1.45;
}
.hrow:last-child{border-bottom:0}
.hrow .hv{font:600 10.5px/1.6 var(--mono);color:var(--faint);flex:none;min-width:22px}
.hrow .hs{font-weight:650;color:var(--hc);flex:none}
.hrow .hn{color:var(--muted);min-width:0;overflow-wrap:anywhere}
.hrow .hd{margin-left:auto;color:var(--faint);font-size:10.5px;white-space:nowrap;flex:none}
.hrow.superseded{opacity:.62}
.hrow.superseded .hv{text-decoration:line-through}

/* the queue card's action word */
.card .act-pill{
  font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;
  padding:2px 7px;border-radius:20px;white-space:nowrap;
  background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac);
  border:1px solid color-mix(in srgb,var(--ac) 34%,transparent);
}
.card .act-pill.idle{background:transparent;color:var(--faint);border-color:var(--line);font-weight:600}

/* sections */
section{margin-bottom:30px}
section > h3{
  margin:0 0 13px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--faint);font-weight:650;display:flex;align-items:center;gap:9px;
}
section > h3::after{content:"";flex:1;height:1px;background:var(--line)}

.beat{border-left:2px solid var(--line);padding:0 0 0 16px;margin-bottom:16px;position:relative}
.beat::before{content:"";position:absolute;left:-4px;top:6px;width:6px;height:6px;border-radius:50%;background:var(--line-strong)}
.beat.hook{border-left-color:var(--accent)}
.beat.hook::before{background:var(--accent)}
.beat .role{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);font-weight:650;margin-bottom:4px}
.beat.hook .role{color:var(--accent)}
.beat p{margin:0;font-size:15.5px;line-height:1.6}
.beat.hook p{font-size:17px;font-weight:550;letter-spacing:-.01em}

table.scenes{width:100%;border-collapse:collapse;font-size:13px}
table.scenes th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--faint);font-weight:650;padding:0 12px 8px 0;border-bottom:1px solid var(--line);
}
table.scenes td{padding:9px 12px 9px 0;border-bottom:1px solid var(--line);vertical-align:top;color:var(--muted)}
table.scenes td:first-child{font:600 12px var(--mono);color:var(--faint);width:32px}
table.scenes td:nth-child(2){color:var(--text);font-weight:550;white-space:nowrap}

.caption-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
.caption-card .ch{display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.caption-card .ch b{font-size:12px;font-weight:650}
.caption-card .ch .len{font-size:11px;color:var(--faint);font-family:var(--mono)}
.copy{
  margin-left:auto;background:transparent;border:1px solid var(--line-strong);
  border-radius:6px;padding:4px 10px;font-size:11.5px;color:var(--muted);
}
.copy:hover{border-color:var(--accent);color:var(--accent)}
.caption-card pre{
  margin:0;padding:14px;white-space:pre-wrap;word-wrap:break-word;
  font:inherit;font-size:14px;line-height:1.6;
}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;color:var(--accent);background:color-mix(in srgb,var(--accent) 11%,transparent);border-radius:5px;padding:3px 9px}

.media{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.media video{width:260px;border-radius:var(--radius);background:#000;border:1px solid var(--line)}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px;flex:1;min-width:240px}
.strip figure{margin:0}
.strip img{width:100%;aspect-ratio:1080/1350;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;cursor:zoom-in;background:var(--panel)}
.strip img:hover{border-color:var(--accent)}
.strip figcaption{font-size:10px;color:var(--faint);margin-top:4px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.missing{font-size:12.5px;color:var(--faint);background:var(--panel);border:1px dashed var(--line-strong);border-radius:var(--radius);padding:14px 16px;line-height:1.5}
.save{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.save .act{flex:none}
.savehint{font-size:11.5px;color:var(--faint);line-height:1.45;flex:1;min-width:200px}
.savehint b{color:var(--muted);font-weight:650}

/* ---------- posting flow bar ----------
   Posting is a round trip: the file goes to the camera roll here, the caption
   is pasted in Instagram, and the post is marked here again afterwards. All
   three used to live at different scroll depths of a long page. This pins them
   to the bottom of the pane instead, so none of it needs a scroll. */
.flowbar{
  position:sticky;bottom:14px;z-index:6;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  background:color-mix(in srgb,var(--panel-2) 96%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border:1px solid var(--line-strong);border-radius:13px;padding:11px 12px;
  box-shadow:0 12px 34px rgba(0,0,0,.45);
}
.flowtop{flex:1 1 100%;display:flex;align-items:flex-start;gap:10px;margin-bottom:2px}
.flowhint{margin:0;font-size:11.5px;line-height:1.45;color:var(--faint)}
.flowhint b{color:var(--text);font-weight:650}
/* Two captions per post, and they are not interchangeable — so which one step
   2 will take is stated, not assumed. */
.capsel{
  margin-left:auto;flex:none;display:flex;
  border:1px solid var(--line-strong);border-radius:7px;overflow:hidden;
}
.capsel button{
  background:transparent;border:0;padding:4px 9px;
  font-size:11px;font-weight:650;line-height:1.5;color:var(--faint);
}
.capsel button:hover{color:var(--text)}
.capsel button[aria-pressed=true]{background:var(--text);color:var(--bg)}
.fstep{
  flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:7px;
  background:transparent;border:1px solid var(--line-strong);border-radius:9px;
  padding:9px 8px;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;
}
.fstep i{
  width:17px;height:17px;border-radius:50%;border:1px solid var(--line-strong);
  display:grid;place-items:center;font:700 10px/1 inherit;font-style:normal;flex:none;
}
.fstep:hover{border-color:var(--text);color:var(--text)}
.fstep.now{border-color:var(--accent);color:var(--text)}
.fstep.now i{background:var(--accent);border-color:var(--accent);color:#fff}
.fstep.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 38%,transparent)}
.fstep.done i{background:var(--ok);border-color:var(--ok);color:#0F1712}
.fstep:disabled{opacity:.45;cursor:default}

.rev{
  background:var(--panel);border:1px solid var(--line);
  border-left:3px solid var(--line-strong);border-radius:var(--radius);
  padding:11px 14px;margin-bottom:8px;
}
.rev.now{border-left-color:var(--ok)}
.revh{display:flex;align-items:center;gap:9px;margin-bottom:5px;flex-wrap:wrap}
.revh b{font-size:13.5px;font-weight:700;font-family:var(--mono)}
.revwhat{font-size:13px;color:var(--muted);line-height:1.5}

ul.notes{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px}
ul.notes li{margin-bottom:6px}
.src{font-family:var(--mono);font-size:12px;color:var(--faint)}

/* modal */
dialog{
  border:1px solid var(--line-strong);border-radius:14px;background:var(--panel);
  color:var(--text);padding:0;max-width:860px;width:92vw;max-height:86vh;
}
dialog::backdrop{background:rgba(0,0,0,.72)}
.mh{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;font-size:15px;font-weight:650}
.mh .x{margin-left:auto;background:transparent;border:none;font-size:22px;color:var(--faint);line-height:1;padding:0 4px}
.mh .x:hover{color:var(--text)}
.mb{padding:18px 20px;overflow-y:auto;max-height:64vh}
.mb p.hint{margin:0 0 14px;font-size:13px;color:var(--muted);line-height:1.55}
.mb h4{margin:20px 0 9px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
.mb h4:first-child{margin-top:0}
.mb pre{
  background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:14px;
  font:12px/1.6 var(--mono);white-space:pre-wrap;word-wrap:break-word;margin:0 0 16px;
}
.mf{display:flex;gap:9px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.rq{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:9px;background:var(--bg)}
.rq .rqh{display:flex;align-items:center;gap:9px;margin-bottom:5px;flex-wrap:wrap}
.rq .rqh b{font-size:13.5px;font-weight:600}
.rq .why{font-size:12.5px;color:var(--muted);line-height:1.5}
.rq .why em{color:var(--text);font-style:normal}
#lightbox{max-width:min(640px,94vw);padding:0;background:transparent;border:none}
#lightbox img{width:100%;border-radius:12px;display:block}

.toast{
  position:fixed;bottom:22px;left:50%;transform:translate(-50%,80px);
  background:var(--text);color:var(--bg);border-radius:9px;padding:10px 18px;
  font-size:13px;font-weight:600;opacity:0;transition:.22s;pointer-events:none;z-index:99;
}
.toast.on{transform:translate(-50%,0);opacity:1}
kbd{font:11px var(--mono);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}

/* ---------- narrow screens ----------
   Deliberately last in the file. The two panes become master → detail: the
   queue is the page, tapping a post swaps to its script, and a sticky back bar
   returns. Both approval tracks stack so neither gets squeezed. */
@media(max-width:900px){
  header{padding:13px 16px;gap:11px}
  .brand{margin-right:0;flex:1 1 100%}
  .stats{flex:1 1 100%}
  .stat{flex:1;min-width:0;padding:6px 7px;text-align:center}
  .stat b{font-size:16px}
  .stat span{font-size:8.5px;letter-spacing:.02em}
  .hbtn{flex:1;text-align:center;padding:9px 10px}

  .wrap{grid-template-columns:1fr;height:auto}
  .queue{border-right:none;overflow:visible;padding:12px 15px 48px}
  .detail{display:none;overflow:visible;padding:0 15px 64px}
  body.viewing .queue{display:none}
  body.viewing .detail{display:block}

  .backbar{
    display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;
    background:var(--bg);border-bottom:1px solid var(--line);
    margin:0 -15px 20px;padding:13px 15px;
  }
  .backbar button{
    background:transparent;border:none;color:var(--accent);
    font-size:14px;font-weight:600;padding:4px 0;display:flex;align-items:center;gap:6px;
  }
  .backbar .ctx{font-size:12px;color:var(--faint);margin-left:auto;font-family:var(--mono)}

  .dhead h2{font-size:22px;max-width:none}
  .rail .step{font-size:9px;padding:6px 2px}
  .rail .step span{display:none}
  .tracks{grid-template-columns:1fr;gap:12px}
  .act{flex:1 1 auto;justify-content:center}
  .media{gap:14px}
  .media video{width:100%;max-width:320px}
  .strip{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));min-width:0}
  table.scenes td:nth-child(2){white-space:normal}
  .mb{max-height:58vh}
  .mf{gap:7px}
  .mf .hbtn{flex:1 1 auto}

  /* Thumb reach beats page position: on a phone the bar leaves the flow of the
     page entirely and sits above the home indicator, visible at any scroll. */
  .flowbar{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    border-radius:0;border-left:0;border-right:0;border-bottom:0;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  }
  .fstep{font-size:12px;padding:10px 6px;gap:6px}
  /* Only the posts that actually show a bar pay for the space under it. */
  body.viewing .detail:has(.flowbar){padding-bottom:124px}
}
</style>

 * here is invisible to the desk and can never be approved.
 *
 *   content/CONTENT_REVIEW.md               the two-gate process and the status
 *                                           vocabulary — the desk uses its words
 *   content/DAILY_RENDER_TASK.md            what the daily task drafts, builds
 *                                           and is forbidden from approving
 *   content/calendar.md                     queue, status, posted dates
 *   content/reel-N/script-and-caption.md    standalone film-ready copy + scenes
 *   content/carousel-post-1/caption.md      carousel captions
 *   social/brand-identity.md                voice, palette, attribution rules
 *
 * content/pending-review/week-1-reels.md is history: scripts are no longer
 * written in weekly batches. The task keeps three days of calendar coverage,
 * drafting in curriculum order, and each draft lands here at review.script
 * 'pending' for approval on the desk.
 *
 * Each post carries two independent review tracks:
 *
 *   review.script   the words        pending | approved | changes | rejected
 *   review.content  the rendered cut awaiting-render | in-review | approved
 *                                    | rerender
 *
 * Those keys map onto CONTENT_REVIEW.md's statuses: awaiting-render is
 * "Script approved", in-review is "Content pending review", approved is
 * "Ready to post", rerender is "Content rejected — regenerate". There is no
 * permanent reject for a cut — per that doc, rejecting one means regenerate.
 *
 * They gate each other in one direction only: nothing renders until the script
 * is approved, and approving a script never implies the cut that comes out of
 * it is any good. `awaiting-render` means the render task hasn't produced a
 * file yet; `in-review` means one exists and is waiting on you.
 *
 * `postedDate` is the baseline for a third, non-review track: whether the post
 * has gone out. It sits beside `review` rather than inside it because it
 * records a date, not an approval, but it syncs the same way the other two do.
 *

 * stored separately in localStorage and shown as an override, so the two never

    ig: `The marker bumps you before you throw. That is a foul — and you still don't have to stop the game over it.

**First, what actually counts as a marking foul.** "A Defensive Throwing Foul occurs when:" — "There is non-minor contact between the thrower and an illegally positioned defensive player (Section 18.1); or" "A defensive player initiates non-minor contact with the thrower, or there is non-minor contact resulting from the thrower and the defender both vying for the same unoccupied position, prior to the thrower releasing the pass."

Read the two limbs together and the shape is clear. It is contact, and it is contact with a position problem behind it. A marker who is merely close to you is not fouling you.

**Now the part that confuses people, and it should.** If contact is what makes something a foul, how can you call it an infraction? Look at the two definitions the rulebook gives:

"A breach of the rules due to non-minor contact between two or more opposing players is a foul."

"A breach of the rules regarding a Marking or Travel breach is an infraction. Infractions do not stop play."

By the first one, the bump is a foul. Full stop. Nothing you say afterwards changes what happened.

"Foul" stops play. "Contact" doesn't stop it at all, and the count goes back to one.

That is a rare thing in this rulebook: a call that costs you nothing. You keep your pivot, you keep your eyes downfield, and the stall count you were losing resets. Plenty of players stop the game out of habit when they didn't have to.

<script>
"use strict";

/* BUILD:CONFIG — generated by social/dashboard/build_desk.py. Do not edit here. */
const MEDIA_BASE = 'media/';
const IMG_EXT    = '.jpg';
const PFP        = 'media/pfp.png';
/* /BUILD:CONFIG */

const STORE = 'luf-content-desk-v2';
const STORE_V1 = 'luf-content-desk-v1';
/* Local calendar date, not UTC. toISOString() reports UTC, so anywhere east of
   Greenwich the desk spent the first hours of every day still calling it
   yesterday — at UTC+8 that meant midnight to 08:00 local, which is exactly
   when the morning review happens. fmtDate() already parses as local, so this
   also stops the two disagreeing. */
const TODAY = (() => {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
})();

const mediaURL = (folder, file) => MEDIA_BASE + folder + '/' + file;
const isMobile = () => window.matchMedia('(max-width:900px)').matches;

/* ---------- cross-device sync ----------
   The desk is public and can never hold a credential able to write to the
   repo, so a small Cloudflare Worker does that instead — see
   social/dashboard/worker/README.md to deploy one. Until SYNC_URL is set,
   everything below is inert and the desk behaves exactly as it did before:
   approvals stay local to this browser only. */
const SYNC_URL = 'https://luf-content-desk-sync.learnultimatefrisbee.workers.dev';
const PASS_KEY = 'luf-desk-pass';
const RAW_BASE = 'https://raw.githubusercontent.com/minyigoh/ultimate-rules/main/content/';
const REMOTE_STATE_URL = RAW_BASE + 'review-state.json';

let remoteState = {};
const syncing = new Set(); // `${postId}:${track}` currently in flight — in-memory only, resets on reload
const SYNC_TOAST = {
  script:  'Script decision synced',
  content: 'Content decision synced',
  posted:  'Posted state synced'
};

/* Whether the last load actually got the repo's state. When this is false the
   desk is showing data.js's baked-in snapshot, which is a stale picture of
   every decision made since the last rebuild — it must never be presented as
   though it were current. See remoteStateFailed's use in renderStats(). */
let remoteStateFailed = null;   // null = not tried, false = loaded, string = why it failed

async function loadRemoteState(){
  // Two attempts: raw.githubusercontent rate-limits unauthenticated reads, and
  // the ?t= cache-buster means every load is a Fastly miss that reaches origin.
  // A single 429 used to leave remoteState empty in total silence.
  for (let attempt = 1; attempt <= 2; attempt++){
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    try {
      const res = await fetch(REMOTE_STATE_URL + '?t=' + Date.now(), {cache:'no-store', signal: ctrl.signal});
      clearTimeout(timer);
      if (!res.ok){
        // The old code tested res.ok and then did nothing when it was false —
        // not even throwing — so a 404/429/5xx produced an empty state with no
        // error anywhere. That is the bug that made approvals look reverted.
        remoteStateFailed = 'HTTP ' + res.status + ' ' + res.statusText;
        console.error('[desk] review-state.json fetch failed:', remoteStateFailed);
        if (attempt === 1 && res.status !== 404){ await new Promise(r => setTimeout(r, 900)); continue; }
        return;
      }
      remoteState = await res.json();
      remoteStateFailed = false;
      console.info('[desk] review-state.json loaded —', Object.keys(remoteState).length, 'posts');
      return;
    } catch (err) {
      clearTimeout(timer);
      remoteStateFailed = (err && err.name === 'AbortError') ? 'timed out after 8s' : String(err && err.message || err);
      console.error('[desk] review-state.json fetch failed:', remoteStateFailed);
      if (attempt === 1){ await new Promise(r => setTimeout(r, 900)); continue; }
    }
  }
}

/* What another device has already synced for this post/track, or failing
   that, the snapshot baked in at the last full rebuild. This sits between
   data.js and localStorage: fresher than the former, overridden by anything
   this browser hasn't confirmed synced yet. */
function baseline(p, name){
  const r = remoteState[p.id] && remoteState[p.id][name];
  if (r) return r;
  // data.js keeps the posted date beside `review` rather than inside it, so
  // this one track's fallback is synthesised instead of read straight out.
  if (name === 'posted'){
    return p.postedDate ? {status:'posted', date: p.postedDate} : {status:'unposted', date: null};
  }
  return p.review[name];
}
const samePosted = (a, b) =>
  !!a && !!b && a.status === b.status && (a.date || null) === (b.date || null);
function repoNote(p, name){
  const r = remoteState[p.id] && remoteState[p.id][name];
  if (r && r.updatedAt) return new Date(r.updatedAt).toLocaleDateString();
  return p.review[name].on;
}

function getPassphrase(){
  let pass = localStorage.getItem(PASS_KEY);
  if (!pass){
    pass = prompt('Passphrase for syncing approvals to the repo (set once per browser — must match the Worker’s DESK_PASSPHRASE):');
    if (pass) localStorage.setItem(PASS_KEY, pass);
  }
  return pass;
}

async function syncToRepo(p, trackName, value, what, also){
  if (!SYNC_URL) return;
  const key = p.id + ':' + trackName;
  if (syncing.has(key)) return;
  const pass = getPassphrase();
  if (!pass) return;

  syncing.add(key);
  renderList();
  try {
    const res = await fetch(SYNC_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        passphrase: pass,
        postId: p.id, postDate: p.date, postTitle: p.title, folder: p.folder,
        track: trackName, status: value.status, note: value.note || '', tags: value.tags || [],
        // Which version this decision judged. The Worker stores it beside the
        // status, and the desk withdraws the decision when the version moves on.
        rev: typeof value.rev === 'number' ? value.rev : null,
        also: also ? {track: also.track, status: also.value.status, note: also.value.note || '',
                      tags: also.value.tags || [],
                      rev: typeof also.value.rev === 'number' ? also.value.rev : null} : null,
        calendarLabel: calendarStatus(p), postedDate: postedOn(p) || null,
        // The Worker runs on UTC edge nodes; feedback rounds should be dated
        // in the reviewer's day, not Cloudflare's.
        localDate: TODAY
      })
    });
    if (res.status === 401){
      localStorage.removeItem(PASS_KEY);
      toast('Wrong passphrase — try again from this post');
    } else if (!res.ok){
      throw new Error(await res.text());
    } else {
      // Fold into the in-memory baseline immediately so the badge clears
      // without waiting on the next fetch of review-state.json.
      remoteState[p.id] = remoteState[p.id] || {};
      remoteState[p.id][trackName] = value;
      if (also) remoteState[p.id][also.track] = also.value;
      /* Do NOT drop the local copy here. The Worker has committed, but
         raw.githubusercontent serves from a CDN that lags a push by minutes,
         so the next reload can still fetch a copy that predates this decision.
         Deleting now meant that reload found no local override, read the stale
         file, and showed the OLD status -- the decision "reverting" on refresh
         until the CDN caught up. Instead, stamp it confirmed and keep it; the
         reconcile pass on boot removes it once the repo demonstrably has it. */
      if (state[p.id] && state[p.id][trackName]) state[p.id][trackName].syncedAt = Date.now();
      if (also && state[p.id] && state[p.id][also.track]) state[p.id][also.track].syncedAt = Date.now();
      save();
      toast(what || SYNC_TOAST[trackName]);
    }
  } catch {
    toast('Sync failed — kept locally, will retry on next load');
  }
  syncing.delete(key);
  renderStats(); renderList(); renderDetail(true);
}

/* A local track the Worker has already accepted. Kept only until the repo copy
   we can actually read catches up with it — see reconcileRemote. */
/* Note the timestamp comparison: a track edited again after its sync is not
   confirmed any more. Without that, typing on after a sync left the edit
   looking committed — the label said synced, the queue dropped its dot, and
   the boot sweep skipped the retry it needed. */
const confirmed = t => !!(t && t.syncedAt && t.syncedAt >= (t.updatedAt || 0));

/* Drop local overrides the repo has caught up on, so localStorage can never
   become a permanent shadow over review-state.json. Compares timestamps rather
   than assuming: a local track survives only while it is strictly newer than
   what the repo reports, which is exactly the CDN propagation window. */
let warnedStaleWorker = false;
function reconcileRemote(){
  let dropped = 0;
  for (const p of POSTS){
    const d = state[p.id];
    if (!d) continue;
    for (const name of ['script', 'content', 'posted']){
      const local = d[name];
      if (!confirmed(local)) continue;               // never synced — keep, sweep will retry
      const r = remoteState[p.id] && remoteState[p.id][name];
      if (!r) continue;
      const remoteAt = Date.parse(r.updatedAt || 0) || 0;
      /* The repo must have the VERSION too, not just the status. An older
         Worker silently drops `rev`, and dropping the local copy against a
         rev-less remote would throw the stamp away -- so a re-approval of a
         redrafted script would look right, then flip back to "Redrafted —
         review again" as soon as the CDN caught up, with no way to ever clear
         it. Keep the override until the repo demonstrably holds the stamp.
         Harmless if it never does: it just stays listed as unsynced. */
      const stamped = typeof local.rev === 'number';
      if (stamped && r.rev !== local.rev){
        if (!warnedStaleWorker){
          warnedStaleWorker = true;
          console.warn('[desk] the repo is not recording decision versions — ' +
            'deploy social/dashboard/worker/worker.js before relying on the review-again flow');
        }
        continue;
      }
      if (remoteAt >= (local.updatedAt || 0)) { delete d[name]; dropped++; }
    }
    if (!Object.keys(d).length) delete state[p.id];
  }
  if (dropped){ save(); console.info('[desk] reconciled', dropped, 'local override(s) the repo now has'); }
}

// Runs once on boot: anything still sitting in localStorage never made it to
// the repo last time (offline, a typo'd passphrase, the Worker not deployed
// yet) — try each one again rather than waiting for you to notice.
function syncSweep(){
  if (!SYNC_URL) return;
  for (const p of POSTS){
    const d = state[p.id];
    if (!d) continue;
    // Anything already confirmed is waiting on CDN propagation, not on a retry.
    // Re-POSTing it would rewrite the repo from this browser's copy and could
    // clobber a newer decision made on another device.
    if (d.script  && !confirmed(d.script))  syncToRepo(p, 'script', d.script);
    if (d.content && !confirmed(d.content)) syncToRepo(p, 'content', d.content);
    if (d.posted  && !confirmed(d.posted))  syncToRepo(p, 'posted', d.posted);
  }
}

/* Two tracks. The script is the words; the content is the cut that comes out of
   the render. Approving one says nothing about the other. */
const SCRIPT_STATUS = {
  pending:  {label:'Needs review',  color:'var(--warn)', calendar:'Pending review'},
  approved: {label:'Script approved', color:'var(--ok)', calendar:'Script approved'},
  changes:  {label:'Changes asked', color:'var(--warn)', calendar:'Pending review — changes requested'},
  rejected: {label:'Rejected',      color:'var(--bad)',  calendar:'Rejected'}
};
/* Labels are the status vocabulary from content/CONTENT_REVIEW.md verbatim, so
   what the desk shows and what calendar.md records are the same words. There is
   deliberately no permanent "rejected" for a render — per that doc, rejecting a
   cut always means regenerate. */
const CONTENT_STATUS = {
  'awaiting-render': {label:'Not yet rendered',  color:'var(--info)',   calendar:'Script approved'},
  'in-review':       {label:'Content pending review', color:'var(--warn)', calendar:'Content pending review'},
  approved:          {label:'Ready to post',     color:'var(--ok)',     calendar:'Ready to post'},
  rerender:          {label:'Rejected — regenerate', color:'var(--accent)', calendar:'Content rejected — regenerate'}
};

/* What the render task can be told is wrong, in its own vocabulary. Free text
   alone tends to produce "make it better"; these make the ask actionable. */
const ISSUES = [
  'Pacing / timing',
  'On-screen text',
  'Visuals / layout',
  'Rule citation',
  'Audio',
  'Framing / crop',
  'Wrong take'
];

const STAGES = {
  'script-review':   {n:1, label:'Script',  color:'var(--warn)'},
  'awaiting-render': {n:2, label:'Render',  color:'var(--info)'},
  'content-review':  {n:3, label:'Content', color:'var(--warn)'},
  ready:             {n:4, label:'Ready',   color:'var(--ok)'},
  posted:            {n:5, label:'Posted',  color:'var(--faint)'}
};
const STAGE_ORDER = ['script-review','awaiting-render','content-review','ready','posted'];

/* Shown instead of the stored label when a decision has gone stale. Deliberately
   not members of SCRIPT_STATUS / CONTENT_STATUS: nothing is ever *stored* in
   these states, they are what the desk says about a stored decision whose
   subject has been replaced underneath it. */
const STALE_SCRIPT  = {label:'Redrafted \u2014 review again', color:'var(--accent)', calendar:'Pending review'};
const STALE_CONTENT = {label:'New cut \u2014 review again',   color:'var(--accent)', calendar:'Content pending review'};

/* ---------- versions, and decisions that have gone stale ----------
   A decision is a stamp on one version of one thing, never a sticky flag on the
   post. The script carries a rev the render task bumps every time it redrafts;
   the cut's rev is just the last entry in `revisions`. When either moves past
   the version a decision was made about, that decision is STALE -- it judged
   words or a cut that no longer exist, so the desk stops reporting it as the
   current state and asks again.

   This is the whole 2026-09-04 mess. reel-32's script was approved at 07:23
   against v1, the task redrafted it at 07:26 and rendered from v2 at 07:44 --
   and the desk showed "Script approved" the entire time, for words that had
   never been read. The task cannot fix that by writing an approval; it must
   never write one. It can only bump the version, which can never do anything
   except withdraw trust. That asymmetry is what makes this safe. */
function scriptRevOf(p){
  const r = remoteState[p.id];
  return (r && r.scriptRev) || p.scriptRev || 1;
}
function contentRevOf(p){
  const revs = revisionsOf(p);
  if (!revs.length) return 0;
  const last = revs[revs.length - 1];
  return last.v || revs.length;
}
/* Which version a decision judged. A decision written before the desk stamped
   versions carries none; those read as judging whatever is current, because we
   cannot know otherwise and thirty shipped posts must not all light up as
   unreviewed. The ones that genuinely predate their subject carry an explicit
   rev, written by the 2026-09-04 migration in tools/migrate_revs.py. */
const revOf = (t, cur) => (t && typeof t.rev === 'number') ? t.rev : cur;

/* `pending` and `in-review` are not decisions, so they can never go stale --
   they already mean "waiting on you". Only a stamp can be out of date. */
function staleScript(p){
  const t = track(p.id,'script') || baseline(p,'script');
  if (!t || t.status === 'pending') return false;
  return revOf(t, scriptRevOf(p)) < scriptRevOf(p);
}
function staleContent(p){
  const t = track(p.id,'content') || baseline(p,'content');
  if (!t || t.status === 'in-review' || t.status === 'awaiting-render') return false;
  const cur = contentRevOf(p);
  return cur > 0 && revOf(t, cur) < cur;
}
/* What the desk acts on everywhere a status gates something: the queue, the
   rail, the calendar row, the filters. A stale approval gates nothing. */
const effScript  = p => staleScript(p)  ? 'pending'   : scriptStatus(p);
const effContent = p => staleContent(p) ? 'in-review' : contentStatus(p);
const sMetaOf = p => staleScript(p)  ? STALE_SCRIPT  : SCRIPT_STATUS[scriptStatus(p)];
const cMetaOf = p => staleContent(p) ? STALE_CONTENT : CONTENT_STATUS[contentStatus(p)];

/* Was this cut built from words you had actually approved? The render guard in
   tools/apply_additions.py refuses the flip when it wasn't, so this only ever
   fires on a cut that predates the guard -- reel-32's, built 2026-09-04 from a
   redraft approved for its previous version. Worth saying out loud rather than
   quietly dropping, because it is the one cut on the desk whose words nobody
   signed off. */
function builtFromUnapprovedScript(p){
  const revs = revisionsOf(p);
  if (!revs.length) return null;
  const last = revs[revs.length - 1];
  if (typeof last.builtFromScriptRev !== 'number') return null;
  const t = track(p.id,'script') || baseline(p,'script');
  if (!t || t.status !== 'approved') return last.builtFromScriptRev;
  const stamped = revOf(t, scriptRevOf(p));
  return stamped === last.builtFromScriptRev ? null : last.builtFromScriptRev;
}

function historyOf(p, name){
  const h = remoteState[p.id] && remoteState[p.id].history;
  return (h && h[name]) || [];
}

/* ---------- the one thing this post wants from you ----------
   Every card and every queue row is driven from here, so the queue's word and
   the panel's sentence can never disagree. `who` is the whole point: 'you'
   means it is blocked on a decision, 'task' means the next scheduled run moves
   it and there is nothing to do, 'done' means it is finished. */
function needOf(p){
  const sRaw = scriptStatus(p), cRaw = contentStatus(p);
  const s = effScript(p), c = effContent(p);

  if (staleScript(p)){
    const was = SCRIPT_STATUS[sRaw].label.toLowerCase();
    const at  = revOf(track(p.id,'script') || baseline(p,'script'), scriptRevOf(p));
    return {who:'you', on:'script', short:'Re-read script', color:'var(--accent)', ico:'\u21BB',
      title:'Read the script again \u2014 the words changed after you decided',
      body:'The render task redrafted this to <b>v' + scriptRevOf(p) + '</b>. Your \u201c' + was +
           '\u201d was stamped against v' + at + ', so it says nothing about what is on screen now. ' +
           'Approve these words, or ask for more changes.'};
  }
  if (s === 'pending') return {who:'you', on:'script', short:'Read script', color:'var(--warn)', ico:'1',
    title:'Read the script and decide',
    body:'Nothing renders until you approve the words. Approve, request changes, or reject the topic.'};
  /* A shipped post still flagged for changes. reel-29 has sat like this since
     2026-09-01 with an empty note -- almost certainly a mis-click, but the
     daily run rewrites anything parked at `changes`, so it is queued to redraft
     a script that already went out. Nothing else on the desk would ever have
     told her. */
  if (s === 'changes' && postedOn(p)) return {who:'you', on:'script', short:'Clear flag',
    color:'var(--warn)', ico:'!',
    title:'Already posted, but the script is still flagged for changes',
    body:'It went out on ' + postedOn(p) + ', and the next daily run rewrites anything parked at ' +
         '\u201cchanges\u201d. If you didn\u2019t mean to leave this here, press Request changes again to clear it.'};
  if (s === 'changes') return {who:'task', on:'script', short:'Redrafting', color:'var(--info)', ico:'\u2699',
    title:'Nothing for you \u2014 the next daily run rewrites this',
    body:'It redrafts against your note, archives the old copy, and puts the new words back here for review. ' +
         'Don\u2019t leave a post parked at \u201cchanges\u201d you didn\u2019t mean \u2014 the run rewrites anything sitting here.'};
  if (s === 'rejected') return {who:'done', on:'script', short:'Dropped', color:'var(--faint)', ico:'\u2715',
    title:'Topic dropped',
    body:'The task will not redraft this, and pulls the next lesson in curriculum order to cover the date.'};

  if (staleContent(p)){
    const was = CONTENT_STATUS[cRaw].label.toLowerCase();
    const at  = revOf(track(p.id,'content') || baseline(p,'content'), contentRevOf(p));
    return {who:'you', on:'content', short:'Watch new cut', color:'var(--accent)', ico:'\u21BB',
      title:'Watch the new cut \u2014 v' + contentRevOf(p) + ' has been rendered since you last looked',
      body:'Your \u201c' + was + '\u201d was about <b>v' + at + '</b>, which has been superseded. ' +
           'What is playing above is the new one.'};
  }
  if (c === 'awaiting-render') return {who:'task', on:'content', short:'Rendering', color:'var(--info)', ico:'\u2699',
    title:'Nothing for you \u2014 it is in the render queue',
    body:'The script is approved, so the next scheduled run builds it. There is nothing to judge until a file exists.'};
  if (c === 'in-review') return {who:'you', on:'content', short:'Watch cut', color:'var(--warn)', ico:'2',
    title:'Watch the cut and decide',
    body:'Approve it, send it back for a re-render if the build is wrong, or send it back to the script if the ' +
         '<em>words</em> are wrong \u2014 those are different jobs and the buttons say which.'};
  if (c === 'rerender') return {who:'task', on:'content', short:'Rebuilding', color:'var(--info)', ico:'\u2699',
    title:'Nothing for you \u2014 the next daily run rebuilds this',
    body:'It picks the send-back up automatically, against your issue tags and note.'};
  if (postedOn(p)) return {who:'done', on:'post', short:'Posted', color:'var(--faint)', ico:'\u2713',
    title:'Posted ' + postedOn(p), body:'Both gates cleared and it went out. Nothing left to do.'};
  return {who:'you', on:'post', short:'Post it', color:'var(--ok)', ico:'3',
    title:'Post it',
    body:'Both gates are clear. Save the asset, copy the caption <em>before</em> you switch apps, then mark it posted.'};
}

/* ---------- persistence ---------- */
let state = load();

function load(){
  let s = {};
  try { s = JSON.parse(localStorage.getItem(STORE)) || {}; } catch { s = {}; }

  /* `posted` used to be a bare date string, because it was local-only and a
     date was all it had to say. It syncs now, so lift any of those into the
     same {status, date} shape the other two tracks use — otherwise a post
     marked before this change would never sweep up to the repo. */
  for (const d of Object.values(s)){
    if (typeof d.posted === 'string') d.posted = {status:'posted', date: d.posted, updatedAt: Date.now()};
    else if (!d.posted) delete d.posted;
  }

  // v1 stored a single flat decision per post — that was the script track.
  if (!localStorage.getItem(STORE) && localStorage.getItem(STORE_V1)){
    try {
      const old = JSON.parse(localStorage.getItem(STORE_V1)) || {};
      for (const [id, d] of Object.entries(old)){
        if (!d || !d.status) continue;
        s[id] = {script: {status: d.status === 'posted' ? 'approved' : d.status,
                          note: d.note || '', updatedAt: d.updatedAt || Date.now()}};
        if (d.status === 'posted') s[id].posted = {status:'posted', date: TODAY, updatedAt: Date.now()};
      }
      localStorage.setItem(STORE, JSON.stringify(s));
    } catch { /* a failed migration must not block the desk */ }
  }
  return s;
}
function save(){
  try { localStorage.setItem(STORE, JSON.stringify(state)); }
  catch { toast('Could not save — browser storage is blocked'); }
}

/* ---------- posting flow ----------
   Which of the three posting steps a ready cut has been through. Purely local
   — it never syncs, because it describes where *this* phone got to, not the
   post. It is persisted because the desk is nearly always evicted from memory
   while Instagram is in the foreground: without this, coming back to mark the
   post looked identical to arriving at it fresh. */
const FLOW_KEY = 'luf-desk-flow';
let flowState = (() => {
  try { return JSON.parse(localStorage.getItem(FLOW_KEY)) || {}; } catch { return {}; }
})();
const flow = id => flowState[id] || {};
function saveFlow(){
  try { localStorage.setItem(FLOW_KEY, JSON.stringify(flowState)); } catch { /* private mode */ }
}
function markFlow(id, step, extra){
  flowState[id] = Object.assign({}, flowState[id], {[step]: Date.now()}, extra || {});
  saveFlow();
}
function unmarkFlow(id, step){
  if (!flowState[id] || !flowState[id][step]) return;
  delete flowState[id][step];
  saveFlow();
}

/* Which caption the flow bar copies. There are two per post and they are not
   interchangeable, so the bar names the one it will take rather than picking
   quietly. Device-level, not per-post: it describes where you post from this
   phone, and it survives a reload the way the steps do. */
const CAP_KEY = 'luf-desk-caption';
let capTarget = (() => {
  try { return localStorage.getItem(CAP_KEY) === 'TikTok' ? 'TikTok' : 'Instagram'; }
  catch { return 'Instagram'; }
})();
const capShort = pl => pl === 'TikTok' ? 'TikTok' : 'IG';
function setCapTarget(pl){
  capTarget = pl === 'TikTok' ? 'TikTok' : 'Instagram';
  try { localStorage.setItem(CAP_KEY, capTarget); } catch { /* private mode */ }
}
function clearFlow(id){
  if (!flowState[id]) return;
  delete flowState[id];
  saveFlow();
}

/* ---------- note autosave ----------
   Notes are typed, and the two writes a note needs have very different costs:
   localStorage is free, while the repo POST is a git commit. They used to share
   one 400ms debounce, so a paragraph produced a commit every time the typing
   paused for half a second. The disk write stays eager; the commit waits for a
   real pause, and is flushed early on blur or when the tab is backgrounded so
   nothing is left behind when you switch to Instagram mid-sentence. */
const NOTE_SAVE_MS = 300;
const NOTE_SYNC_MS = 2500;
const noteT = {};   // 'postId:track' -> {save, sync}

function stampSaved(p, name){
  const lbl = $('#detail').querySelector(`[data-saved="${name}"]`);
  if (lbl) lbl.textContent = savedLabel(p, name);
}
function queueNote(p, name){
  const k = p.id + ':' + name;
  const t = noteT[k] || (noteT[k] = {});
  clearTimeout(t.save); clearTimeout(t.sync);
  t.save = setTimeout(() => { save(); renderStats(); renderList(); stampSaved(p, name); }, NOTE_SAVE_MS);
  t.sync = setTimeout(() => flushNote(p, name), NOTE_SYNC_MS);
}
function flushNote(p, name){
  const k = p.id + ':' + name;
  const t = noteT[k];
  if (!t) return;                       // nothing typed since the last flush
  clearTimeout(t.save); clearTimeout(t.sync);
  delete noteT[k];
  const cur = track(p.id, name);
  if (!cur) return;
  save(); renderStats(); renderList(); stampSaved(p, name);
  syncToRepo(p, name, cur, (name === 'script' ? 'Script' : 'Content') + ' note synced');
}
function flushAllNotes(){
  for (const k of Object.keys(noteT)){
    const [id, name] = k.split(':');
    const p = POSTS.find(x => x.id === id);
    if (p) flushNote(p, name);
  }
}
window.addEventListener('pagehide', flushAllNotes);
document.addEventListener('visibilitychange', () => { if (document.hidden) flushAllNotes(); });

const track = (id, name) => (state[id] && state[id][name]) || null;

function scriptStatus(p){
  const t = track(p.id, 'script');
  return (t && t.status) || baseline(p,'script').status;
}
function contentStatus(p){
  const t = track(p.id, 'content');
  return (t && t.status) || baseline(p,'content').status;
}
const scriptNote  = p => (track(p.id,'script')  || {}).note || baseline(p,'script').note || '';
const contentNote = p => (track(p.id,'content') || {}).note || baseline(p,'content').note || '';
const contentTags = p => (track(p.id,'content') || {}).tags || baseline(p,'content').tags || [];
const isUrgent    = p => {
  const t = track(p.id, 'content');
  return t && 'urgent' in t ? !!t.urgent : !!baseline(p,'content').urgent;
};
/* The third track. Unlike the other two it carries a date rather than a note,
   but it resolves the same way — local override, then what another device
   synced, then data.js's baseline — so marking a post on your phone reaches
   your PC instead of sitting in that browser forever. */
function postedOn(p){
  const t = track(p.id, 'posted') || baseline(p, 'posted');
  return t.status === 'posted' ? (t.date || null) : null;
}

/* Has the render actually produced a file we can look at? */
const hasMedia = p => !!(p.video || p.slides);

function overridden(p){
  const d = state[p.id];
  if (!d) return false;
  // A confirmed track is in the repo already — it is only still here because
  // the copy we can read hasn't propagated yet. Flagging it "unsaved" would
  // report the CDN's lag as your unfinished work.
  if (d.posted && !confirmed(d.posted) && !samePosted(d.posted, baseline(p,'posted'))) return true;
  const revOfT = t => (typeof t.rev === 'number' ? t.rev : null);
  if (d.script && !confirmed(d.script) &&
      (d.script.status !== baseline(p,'script').status ||
       revOfT(d.script) !== revOfT(baseline(p,'script')) || (d.script.note||'').trim())) return true;
  if (d.content && !confirmed(d.content) &&
      (d.content.status !== baseline(p,'content').status ||
       revOfT(d.content) !== revOfT(baseline(p,'content')) ||
      (d.content.note||'').trim() || (d.content.tags||[]).length || d.content.urgent)) return true;
  return false;
}

function stageOf(p){
  const s = effScript(p), c = effContent(p);
  if (s !== 'approved') return 'script-review';
  // An explicit send-back outranks "posted" — pulling a shipped cut back for a
  // fix is a deliberate act, and hiding it under a Posted badge loses it.
  if (c === 'in-review' || c === 'rerender') return 'content-review';
  if (postedOn(p)) return 'posted';
  if (c === 'approved') return 'ready';
  return 'awaiting-render';
}

/* The single status that belongs in content/calendar.md's Status column, using
   that file's own vocabulary. Posted wins unless a cut has been sent back. */
function calendarStatus(p){
  const s = effScript(p), c = effContent(p);
  if (s !== 'approved') return sMetaOf(p).calendar;
  if (c === 'rerender') return CONTENT_STATUS.rerender.calendar;
  if (postedOn(p)) return 'Posted';
  return staleContent(p) ? STALE_CONTENT.calendar : CONTENT_STATUS[c].calendar;
}

/* ---------- helpers ---------- */
const $  = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => new Date(d+'T00:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});

let toastT;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(()=>t.classList.remove('on'), 1900);
}
async function copy(text, what){
  try { await navigator.clipboard.writeText(text); toast(what + ' copied'); }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(what + ' copied'); }
    catch { toast('Copy failed — select the text manually'); }
    ta.remove();
  }
}

/* ---------- save the finished asset to the phone ----------
   Always pulls the ORIGINAL out of content/ on GitHub, never the desk's own
   bundled copy: build_desk.py downscales carousel slides to 900px JPEG for
   preview, which is not what should go on Instagram. Reels are copied
   untouched, so for those the two are identical.

   navigator.share hands the file to the OS share sheet — "Save to Photos" or
   Instagram directly. Not everywhere supports it (desktop Firefox, older
   Safari), and iOS can reject the call if too long passes between the tap and
   the share, so a plain download is always the fallback. */
function mimeFor(name){
  if (name.endsWith('.mp4')) return 'video/mp4';
  if (name.endsWith('.png')) return 'image/png';
  if (name.endsWith('.jpg') || name.endsWith('.jpeg')) return 'image/jpeg';
  return 'application/octet-stream';
}

function assetList(p){
  if (p.video) return [p.video];
  if (p.slides) return p.slides.map(([f]) => f + '.png');
  return [];
}

/* ---------- revision history ----------
   Written by the render task into review-state.json, newest last. The latest
   revision is always the unsuffixed filename in data.js; earlier attempts are
   kept beside it as <name>.vN.<ext>, per content/CONTENT_REVIEW.md. When
   nothing has been recorded, whatever is on disk is v1 by definition. */
function revisionsOf(p){
  const rec = (remoteState[p.id] && remoteState[p.id].revisions) || [];
  if (rec.length) return rec;
  if (!hasMedia(p)) return [];
  return [{v: 1, renderedAt: baseline(p,'content').on || null,
           changed: 'Initial render.'}];
}

/* Older revisions aren't bundled into docs/desk/ — only the current cut is —
   so previewing one goes to the original in the repo. */
function revisionURL(p, rev){
  const revs = revisionsOf(p);
  const isLatest = rev === revs[revs.length - 1];
  if (isLatest) return p.video ? mediaURL(p.folder, p.video) : null;
  if (!rev.file) return null;
  return RAW_BASE + p.folder + '/' + rev.file;
}

function downloadFiles(files){
  files.forEach((f, i) => {
    // Stagger: browsers drop rapid-fire programmatic downloads.
    setTimeout(() => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(f);
      a.download = f.name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, i * 350);
  });
  toast(files.length > 1 ? files.length + ' files downloading' : 'Downloading');
}

async function saveToPhone(p, btn){
  const names = assetList(p);
  if (!names.length) return false;
  // innerHTML, not textContent: the flow bar's button carries a step marker.
  const label = btn.innerHTML;
  btn.disabled = true;
  let ok = false;

  try {
    const files = [];
    for (let i = 0; i < names.length; i++){
      btn.textContent = names.length > 1 ? `Fetching ${i+1}/${names.length}…` : 'Fetching…';
      const res = await fetch(RAW_BASE + p.folder + '/' + names[i]);
      if (!res.ok) throw new Error(names[i] + ' → HTTP ' + res.status);
      files.push(new File([await res.blob()], names[i], {type: mimeFor(names[i])}));
    }

    if (navigator.canShare && navigator.canShare({files})){
      btn.textContent = 'Opening…';
      try {
        await navigator.share({files, title: p.title});
        ok = true;
      } catch (err) {
        if (err && err.name === 'AbortError') { /* share sheet dismissed — not an error */ }
        else { downloadFiles(files); ok = true; } // NotAllowedError and friends: fall back rather than dead-end
      }
    } else {
      downloadFiles(files);
      ok = true;
    }
  } catch (err) {
    toast('Save failed — ' + (err.message || 'check your connection'));
  }

  btn.disabled = false;
  btn.innerHTML = label;
  return ok;
}

/* Both the caption card's own button and step 2 of the flow bar come here, so
   copying from either one moves the flow along. */
function copyCaption(p, platform){
  const text = platform === 'TikTok' ? p.tiktok : p.ig;
  copy(text + '\n\n' + (p.hashtags || []).join(' '), platform + ' caption');
  // Whichever caption you took is the one on the clipboard, so it is also the
  // one the flow is now waiting on you to paste — including when you took it
  // from the caption cards further down rather than from the bar.
  setCapTarget(platform);
  markFlow(p.id, 'copied', {copiedFor: platform});
  renderDetail(true);
}

function markPosted(p){
  const wasPosted = !!postedOn(p);
  const cur = mutableTrack(p, 'posted');
  cur.status = wasPosted ? 'unposted' : 'posted';
  cur.date = wasPosted ? null : TODAY;
  cur.updatedAt = Date.now();
  // The flow only describes an unposted cut. Clearing it here keeps the store
  // from growing a stale entry per post, and un-marking starts the steps over.
  clearFlow(p.id);
  commit(p, wasPosted ? 'Un-marked' : 'Marked posted — nice one');
  syncToRepo(p, 'posted', cur);
}

/* ---------- render queue: what a scheduled run would pick up ---------- */
function renderQueue(){
  const out = [];
  for (const p of POSTS){
    // effScript, not scriptStatus: a script whose words were redrafted after
    // you approved them is NOT approved any more, and must not render. That is
    // the reel-32 breach -- built 2026-09-04 from a redraft whose approval
    // belonged to the previous version.
    if (effScript(p) !== 'approved') continue;
    const c = effContent(p);
    if (c === 'rerender'){
      // Explicit send-back — queue it even if the post already went out, since
      // asking for it was deliberate. Flagged so the run knows it's a reshoot.
      out.push({post: p, action: 'rerender', urgent: isUrgent(p),
                tags: contentTags(p), note: contentNote(p), posted: !!postedOn(p)});
    } else if (c === 'awaiting-render' && !postedOn(p)){
      out.push({post: p, action: 'render', urgent: false, tags: [], note: '', posted: false});
    }
  }
  // Anything flagged urgent should be the first thing a run touches.
  return out.sort((a,b) => (b.urgent - a.urgent) || a.post.date.localeCompare(b.post.date));
}

/* ---------- header ---------- */
$('#acctName').textContent = ACCOUNT.name;
$('#acctHandle').textContent = ACCOUNT.handle;
const pfp = $('#pfp');
pfp.src = PFP;
pfp.onerror = () => { pfp.style.display='none'; $('#pfpfb').style.display='grid'; };

function renderStats(){
  const at = k => POSTS.filter(p => stageOf(p) === k).length;
  const scriptTodo = POSTS.filter(p => stageOf(p) === 'script-review').length;
  const contentTodo = POSTS.filter(p => stageOf(p) === 'content-review').length;
  const q = renderQueue();

  const onYou = POSTS.filter(p => needOf(p).who === 'you').length;

  $('#stats').innerHTML = [
    ['Needs you', onYou, onYou > 0],
    ['Script review', scriptTodo, scriptTodo > 0],
    ['To render', q.length, false],
    ['Content review', contentTodo, contentTodo > 0],
    ['Ready to post', at('ready'), false],
    ['Posted', at('posted'), false]
  ].map(([l,v,hl]) => `<div class="stat${hl?' hl':''}"><b>${v}</b><span>${esc(l)}</span></div>`).join('')
  + (remoteStateFailed
      ? `<div class="stat hl" style="flex-basis:100%;text-align:left">
           <b style="font-size:15px;line-height:1.4">Showing a stale snapshot — could not read review-state.json (${esc(remoteStateFailed)})</b>
           <span>Decisions you make will still save, but the statuses above are from the last desk rebuild, not the repo. Reload to retry.</span>
         </div>`
      : '');

  const urgent = q.filter(x => x.urgent).length;
  $('#queueBtn').innerHTML = 'Render queue' +
    (q.length ? `<span class="badge">${q.length}${urgent ? '!' : ''}</span>` : '');

  // Only surfaces when something genuinely failed to reach the repo.
  const pending = unsyncedPosts();
  const btn = $('#unsyncedBtn');
  btn.hidden = pending.length === 0;
  btn.innerHTML = `Unsynced<span class="badge">${pending.length}</span>`;
}

/* ---------- queue ---------- */
let filter = 'all';
let query = '';
let selected = null;

const FILTERS = [
  ['all','All', () => true],
  ['you','Needs you', p => needOf(p).who === 'you'],
  ['script','Script review', p => stageOf(p) === 'script-review'],
  ['render','To render', p => renderQueue().some(x => x.post.id === p.id)],
  ['content','Content review', p => stageOf(p) === 'content-review'],
  ['ready','Ready', p => stageOf(p) === 'ready'],
  ['posted','Posted', p => stageOf(p) === 'posted']
];

function renderFilters(){
  $('#filters').innerHTML = FILTERS.map(([k,l,fn]) => {
    const n = k === 'all' ? POSTS.length : POSTS.filter(fn).length;
    return `<button data-f="${k}" aria-pressed="${k===filter}">${esc(l)}<span class="n">${n}</span></button>`;
  }).join('');
}
$('#filters').addEventListener('click', e => {
  const b = e.target.closest('button[data-f]');
  if (!b) return;
  filter = b.dataset.f;
  renderFilters();
  renderList();
});

$('#search').addEventListener('input', e => { query = e.target.value.toLowerCase().trim(); renderList(); });

function haystack(p){
  const s = p.script || {};
  return [p.title, p.type, p.difficulty, p.ig, p.tiktok, s.hook, s.explanation, s.example, s.cta,
          (p.hashtags||[]).join(' '), (p.rules||[]).join(' '), scriptNote(p), contentNote(p)]
    .filter(Boolean).join(' ').toLowerCase();
}

function visible(){
  const fn = (FILTERS.find(f => f[0] === filter) || FILTERS[0])[2];
  return POSTS.filter(p => fn(p) && (!query || haystack(p).includes(query)));
}

/* Today first, then what's coming, then the archive — which only grows, so it
   belongs at the bottom rather than pushing live work off the top. Scheduled
   runs soonest-first; Published runs newest-first, since recent posts are the
   ones worth glancing back at. */
const GROUPS = ['Today', 'Scheduled', 'Published'];
const groupOf = p => p.date === TODAY ? 'Today' : p.date > TODAY ? 'Scheduled' : 'Published';

function sortForQueue(items){
  return [...items].sort((a, b) => {
    const ga = GROUPS.indexOf(groupOf(a)), gb = GROUPS.indexOf(groupOf(b));
    if (ga !== gb) return ga - gb;
    return groupOf(a) === 'Published'
      ? b.date.localeCompare(a.date)
      : a.date.localeCompare(b.date);
  });
}

/* "Reel 3" / "Carousel 2" rather than just the format — the number is how
   these get referred to everywhere else (folders, filenames, the render task's
   reports), so the queue should speak the same way. */
function postLabel(p){
  const m = /^(reel|carousel-post)-(\d+)$/.exec(p.id);
  if (!m) return p.type;
  return (m[1] === 'reel' ? 'Reel ' : 'Carousel ') + m[2];
}

function renderList(){
  const items = sortForQueue(visible());
  const list = $('#list');
  if (!items.length){
    list.innerHTML = `<p style="color:var(--faint);font-size:13px;padding:10px 2px">Nothing matches.</p>`;
    return;
  }
  let html = '', lastGroup = '';
  for (const p of items){
    const g = groupOf(p);
    if (g !== lastGroup){ html += `<div class="daygroup">${g}</div>`; lastGroup = g; }

    const stage = stageOf(p), meta = STAGES[stage];   // still drives the card's left edge colour
    const need = needOf(p);
    const sc = sMetaOf(p).color;
    const cc = cMetaOf(p).color;
    const contentStarted = contentStatus(p) !== 'awaiting-render';
    const syncingNow = syncing.has(p.id+':script') || syncing.has(p.id+':content');

    html += `
      <button class="card" data-id="${esc(p.id)}" style="--st:${meta.color}"
              aria-current="${p.id === selected}">
        <div class="top">
          <span class="date">${esc(fmtDate(p.date))}</span>
          <span class="kind">${esc(postLabel(p))}</span>
          ${p.date === TODAY ? '<span class="kind today">Today</span>' : ''}
        </div>
        <h3>${esc(p.title)}</h3>
        <div class="foot">
          <span class="tt" title="Script · Content">
            <i style="--c:${sc}"></i><i class="${contentStarted?'':'empty'}" style="--c:${cc}"></i>
          </span>
          <span class="act-pill${need.who === 'you' ? '' : ' idle'}"
                style="--ac:${need.color}" title="${esc(need.title)}">${esc(need.short)}</span>
          ${isUrgent(p) ? '<span class="edited">● urgent</span>' : ''}
          ${syncingNow ? '<span class="edited">● syncing…</span>'
            : overridden(p) ? `<span class="edited">● ${SYNC_URL ? 'not synced' : 'unsaved'}</span>` : ''}
        </div>
      </button>`;
  }
  list.innerHTML = html;
}

$('#list').addEventListener('click', e => {
  const c = e.target.closest('.card');
  if (c) select(c.dataset.id, true);
});

/* ---------- detail ---------- */
function select(id, fromUser){
  selected = id;
  renderList();
  renderDetail();
  if (fromUser && isMobile()) enterDetail();
}
function enterDetail(){
  document.body.classList.add('viewing');
  padForFlowbar($('#detail'));   // first chance to measure a bar that was hidden
  if (!(history.state && history.state.desk)) history.pushState({desk:1}, '');
  window.scrollTo(0,0);
}
function exitDetail(){
  document.body.classList.remove('viewing');
  window.scrollTo(0,0);
  const card = $('#list').querySelector('.card[aria-current="true"]');
  if (card) card.scrollIntoView({block:'center'});
}
function backToQueue(){
  if (history.state && history.state.desk) history.back();
  else exitDetail();
}
window.addEventListener('popstate', exitDetail);

/* Rebuilding the pane replaces every node in it, including the textarea under
   the caret. A sync landing 1-2s after you started a sentence used to swap in a
   fresh textarea holding the note as it stood when the debounce last fired —
   the rest of the sentence gone, and the caret with it. Two defences: the note
   now reaches state on every keystroke, so a rebuild renders what you actually
   typed, and the caret is put back exactly where it was. Composition (IME) is
   the one case a rebuild cannot survive at all, so it is deferred instead. */
let composingNote = false;
let pendingDetail = false;

function noteFocus(el){
  const a = document.activeElement;
  if (!a || !a.dataset || !a.dataset.note || !el.contains(a)) return null;
  return {sel: `[data-note="${a.dataset.note}"]`, start: a.selectionStart,
          end: a.selectionEnd, top: a.scrollTop, h: a.style.height};
}
function restoreNoteFocus(el, f){
  if (!f) return;
  const n = el.querySelector(f.sel);
  if (!n) return;
  if (f.h) n.style.height = f.h;          // keep a textarea you dragged taller
  n.focus({preventScroll: true});
  try { n.setSelectionRange(f.start, f.end); } catch { /* not a text field */ }
  n.scrollTop = f.top;
}

function renderDetail(preserveScroll){
  if (composingNote){ pendingDetail = true; return; }
  pendingDetail = false;
  const p = POSTS.find(x => x.id === selected);
  const el = $('#detail');
  const keepY = preserveScroll ? el.scrollTop : 0;
  const keepWinY = preserveScroll ? window.scrollY : 0;
  const keepFocus = preserveScroll ? noteFocus(el) : null;

  if (!p){
    el.innerHTML = `<div class="empty">
      <div class="disc">🥏</div>
      <p>Pick a post from the queue to read its script and sign it off.</p>
      <p style="font-size:12.5px;margin-top:6px">Navigate with <kbd>↑</kbd> <kbd>↓</kbd> · search with <kbd>/</kbd></p>
    </div>`;
    return;
  }

  const parts = [];
  const idx = POSTS.indexOf(p) + 1;
  parts.push(`<div class="backbar">
    <button id="backBtn">← Queue</button>
    <span class="ctx">${idx} / ${POSTS.length}</span>
  </div>`);

  parts.push(`<div class="dhead">
    <h2>${esc(p.title)}</h2>
    <div class="meta">
      <span class="chip"><b>${esc(fmtDate(p.date))}</b> ${p.date === TODAY ? '· today' : ''}</span>
      <span class="chip"><b>${esc(postLabel(p))}</b>${p.typeDetail ? ' · ' + esc(p.typeDetail) : ''}</span>
      ${p.lesson ? `<span class="chip">Lesson <b>${p.lesson}</b> / 75</span>` : ''}
      <span class="chip">${esc(p.difficulty)}</span>
      <span class="chip">${esc(p.pillar)} pillar</span>
      ${p.duration ? `<span class="chip">${esc(p.duration)}</span>` : ''}
      ${(p.rules||[]).map(r => `<span class="chip rule">${esc(r)}</span>`).join('')}
    </div>
    ${p.flag ? `<div class="flag"><span class="ico">!</span><span>${esc(p.flag)}</span></div>` : ''}
  </div>`);

  parts.push(needBarHTML(p));
  parts.push(railHTML(p));
  parts.push(tracksHTML(p));

  /* media */
  if (hasMedia(p)){
    parts.push('<section><h3>Rendered content</h3><div class="media">');
    if (p.video){
      parts.push(`<video src="${esc(mediaURL(p.folder, p.video))}" controls preload="metadata" playsinline></video>`);
    }
    if (p.slides){
      parts.push('<div class="strip">' + p.slides.map(([f,label]) => {
        const src = mediaURL(p.folder, f + IMG_EXT);
        return `<figure><img src="${esc(src)}" alt="${esc(label)}" loading="lazy" data-full="${esc(src)}">
                <figcaption>${esc(label)}</figcaption></figure>`;
      }).join('') + '</div>');
    }
    parts.push('</div>');
    const n = assetList(p).length;
    const revs = revisionsOf(p);
    parts.push(`<div class="save">
      <button class="act" id="saveBtn" style="--c:var(--ok)">
        ${p.video ? 'Save video to phone' : `Save all ${n} slides`}</button>
      <span class="savehint">Opens your phone's share sheet — Save to Photos, or straight into Instagram.
        Always saves <b>v${revs.length ? revs[revs.length-1].v : 1}, the latest</b>, at full quality —
        never the preview above or an older revision.</span>
    </div>`);
    parts.push('</section>');
    parts.push(revisionsHTML(p));
  } else {
    const why = effScript(p) === 'approved'
      ? 'Script is approved, so this is in the render queue. Nothing to review until a file exists.'
      : staleScript(p)
      ? 'The script was redrafted after your last decision, so it is back on track 1. Nothing renders until you approve the new words.'
      : 'The render task only picks up posts whose script is approved, so nothing will be produced yet.';
    parts.push(`<section><h3>Rendered content</h3>
      <div class="missing"><b style="color:var(--text)">Not rendered yet.</b><br>${esc(why)}</div></section>`);
  }

  if (p.script){
    const S = p.script;
    parts.push(`<section><h3>Script</h3>
      <div class="beat hook"><div class="role">Hook</div><p>${esc(S.hook)}</p></div>
      <div class="beat"><div class="role">Explanation</div><p>${esc(S.explanation)}</p></div>
      <div class="beat"><div class="role">Example</div><p>${esc(S.example)}</p></div>
      <div class="beat"><div class="role">Call to action</div><p>${esc(S.cta)}</p></div>
    </section>`);
  }

  if (p.scenes){
    parts.push(`<section><h3>Scene breakdown</h3>
      <table class="scenes">
        <thead><tr><th>#</th><th>Scene</th><th>Content</th></tr></thead>
        <tbody>${p.scenes.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody>
      </table>
    </section>`);
  }

  parts.push(`<section><h3>Captions</h3>
    ${captionCard('Instagram', p.ig)}
    ${captionCard('TikTok', p.tiktok)}
    <div class="tags">${(p.hashtags||[]).map(h => `<span class="tag">${esc(h)}</span>`).join('')}</div>
  </section>`);

  parts.push(`<section><h3>Production notes</h3>
    <ul class="notes">${(p.notes||[]).map(n => `<li>${esc(n)}</li>`).join('')}</ul>
    <p class="src" style="margin-top:12px">Source: ${esc(p.source)}${p.sourceLesson ? ' · ' + esc(p.sourceLesson) : ''}</p>
    <p class="src">Attribution required in every caption: ${esc(ACCOUNT.attribution)}</p>
  </section>`);

  parts.push(flowbarHTML(p));

  el.innerHTML = parts.join('');
  el.scrollTop = keepY;
  if (preserveScroll) window.scrollTo(0, keepWinY);
  wireDetail(p);
  padForFlowbar(el);
  restoreNoteFocus(el, keepFocus);
}

/* A fixed bar sits outside the flow, so nothing reserves room for it and the
   last section ends up underneath. The CSS carries a sensible default; this
   replaces the guess with the height the bar actually came out at, which
   changes with the hint's wrapping and with orientation. */
function padForFlowbar(el){
  const b = el.querySelector('.flowbar');
  // Height reads 0 while the pane is still hidden — on a phone the detail is
  // rendered before `viewing` swaps it in — and padding the pane by 16px would
  // then bury the last section. Leave the CSS default standing until there is
  // something real to measure; enterDetail() calls back once there is.
  const h = b ? b.offsetHeight : 0;
  el.style.paddingBottom = (h && getComputedStyle(b).position === 'fixed')
    ? (h + 16) + 'px' : '';
}
